<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>课程素材引擎 V1｜只读测试</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0}
    .wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px}
    .hero,.card{background:#fff;border:1px solid #e6e9f0;border-radius:18px;box-shadow:0 8px 26px rgba(30,45,80,.06)}
    .hero{padding:22px 24px;margin-bottom:18px}
    h1{font-size:26px;margin:0 0 8px}.sub{color:#657089;line-height:1.6;margin:0}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#eef3ff;color:#355cc9;font-weight:700}
    .badge.safe{background:#eaf8ef;color:#237447}.badge.warn{background:#fff5df;color:#946200}
    .controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:16px 18px;margin-bottom:18px}
    label{font-size:12px;color:#6c7589;display:block;margin-bottom:6px}
    select,button{height:40px;border-radius:10px;border:1px solid #d8deea;background:#fff;padding:0 12px;font:inherit}
    button{cursor:pointer;font-weight:700;background:#172033;color:#fff;border-color:#172033}
    button.secondary{background:#fff;color:#172033}
    .meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
    .meta .card{padding:14px}.k{font-size:12px;color:#798296}.v{font-size:17px;font-weight:800;margin-top:5px;word-break:break-word}
    .section{padding:20px;margin-bottom:18px}.section h2{font-size:19px;margin:0 0 14px}.hint{color:#737d91;font-size:13px;line-height:1.6}
    .word-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .word{border:1px solid #e4e8f0;border-radius:14px;padding:14px;background:#fbfcff}
    .word-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.word-title{font-size:18px;font-weight:850}
    .group{font-size:11px;border-radius:999px;padding:4px 7px;background:#edf1f7;color:#5c6679}
    .word-cn{font-weight:700;margin-top:7px}.word-note,.word-example{font-size:13px;line-height:1.65;color:#5e687b;margin-top:7px}
    .reading{font-size:16px;line-height:1.85}.translation{margin-top:12px;padding-top:12px;border-top:1px dashed #d9deea;color:#667085;line-height:1.8}
    .dialogue{display:grid;gap:9px}.line{padding:11px 13px;border-radius:12px;background:#f7f9fd}.line b{display:inline-block;width:28px}.cn{color:#70798c;font-size:13px;margin-top:4px}
    .tasks{display:grid;gap:10px}.task{border:1px solid #e4e8f0;border-radius:12px;padding:12px 14px}.answer{color:#626d80;margin-top:6px;font-size:13px}
    .checks{display:flex;flex-wrap:wrap;gap:8px}.check{padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700;background:#eaf8ef;color:#237447}.check.bad{background:#ffeded;color:#aa2f2f}
    .error{background:#fff0f0;border:1px solid #ffc7c7;color:#9b2c2c;padding:14px;border-radius:12px;white-space:pre-wrap}
    .footer{font-size:12px;color:#8a93a3;text-align:center;padding-top:4px}
    @media(max-width:780px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.word-grid{grid-template-columns:1fr}.wrap{padding-top:14px}.hero{padding:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>课程素材引擎 V1 · 只读测试</h1>
      <p class="sub">用于检查“素材库 + GitHub 纯代码组课”的自然度、口语感和课程结构。这里不会发布正式课程，也不会修改学习进度。</p>
      <div class="badges">
        <span class="badge">PROTOTYPE</span>
        <span class="badge safe">READ ONLY · 0 WRITE</span>
        <span class="badge warn">不接 08:00 / 18:00 正式发布链</span>
      </div>
    </section>

    <section class="hero controls">
      <div>
        <label for="variant">测试组合</label>
        <select id="variant">
          <option value="0">组合 1</option><option value="1">组合 2</option><option value="2">组合 3</option>
          <option value="3">组合 4</option><option value="4">组合 5</option><option value="5">组合 6</option>
        </select>
      </div>
      <button id="generate">重新组课</button>
      <button id="reload" class="secondary">重新读取最新 context</button>
      <span class="hint">切换组合只改变本页测试 seed，不会保存任何结果。</span>
    </section>

    <div id="app"><section class="hero">正在读取素材库和当前学习 context…</section></div>
    <div class="footer">prototype/lesson-engine · 可整目录删除 · 不属于正式课程真源</div>
  </main>
  <script src="../../data/daily-vocab-data.js"></script>
  <script src="./preview.js"></script>
</body>
</html>
