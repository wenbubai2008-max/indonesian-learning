<body><div class="app">
<div class="top"><div><h1>🇮🇩 印尼语学习</h1><div class="sub">你的个人词库 · 口语 · 高频动词 · 前后缀 · 阅读</div></div><div class="date" id="date"></div></div>
<div class="stats"><div class="stat"><span>今日答题</span><b id="sDone">0</b></div><div class="stat"><span>正确率</span><b id="sRate">0%</b></div><div class="stat"><span>已掌握</span><b id="sKnow">0</b></div><div class="stat"><span>待复习</span><b id="sReview">0</b></div></div>

<section id="home" class="page active">
<div class="homeHero"><h2>今日学习</h2><p>10 个词汇 · 5 个复习 · 1 篇短文 · 5 道测试</p><button onclick="go('daily')">开始今日学习 →</button></div>
<div class="modules">
<button class="module" onclick="go('vocab')"><div class="icon">🧠</div><h3>词汇学习</h3><p>闪卡、选择题、场景题；每个词都可以直接听标准印尼语发音。</p><span class="count">词库试接入 34 个</span></button>
<button class="module" onclick="go('reading')"><div class="icon">📖</div><h3>阅读短文</h3><p>短篇印尼语阅读，重点词高亮，带中文翻译和理解题。</p><span class="count">A2 → B1</span></button>
<button class="module" onclick="go('affix')"><div class="icon">🧩</div><h3>前后缀</h3><p>meN-、peN-、ber-、di-、ter-、-kan、-i，用例词理解构词。</p><span class="count">来自你的前后缀表</span></button>
<button class="module" onclick="go('review')"><div class="icon">🔁</div><h3>错词复习</h3><p>“不会 / 模糊 / 做错”的词自动进入复习，不需要自己整理。</p><span class="count" id="homeReview">0 个待复习</span></button>
<button class="module" onclick="go('progress')"><div class="icon">📊</div><h3>学习记录</h3><p>查看已会、模糊、不会的词。记录保存在当前浏览器。</p><span class="count">自动记录</span></button>
<button class="module" onclick="go('vocab')"><div class="icon">💬</div><h3>口语高频</h3><p>优先学习 soalnya、padahal、ternyata、lumayan 这类真实常用表达。</p><span class="count">雅加达口语优先</span></button>
</div></section>

<section id="daily" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>今日学习</h2><span class="pill">约 20–30 分钟</span></div><div class="dailyList"><div class="dailyItem"><div><b>① 新词学习</b><br><span>今天先学 10 个高价值词</span></div><button class="primary" onclick="startDailyVocab()">开始</button></div><div class="dailyItem"><div><b>② 复习错词</b><br><span>优先复习“模糊 / 不会”</span></div><button class="secondary" onclick="go('review')">复习</button></div><div class="dailyItem"><div><b>③ 阅读短文</b><br><span>1 篇 A2–B1 小短文</span></div><button class="secondary" onclick="go('reading')">阅读</button></div><div class="dailyItem"><div><b>④ 综合测试</b><br><span>印尼语 → 中文 / 中文 → 印尼语 / 场景题</span></div><button class="secondary" onclick="startQuiz()">测试</button></div></div></div></section>

<section id="vocab" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>词汇学习</h2><span class="pill" id="vCount"></span></div><div class="tabs"><button class="active" data-vmode="flash">闪卡</button><button data-vmode="quiz">选择题</button></div><div class="filters"><button class="active" data-cat="all">综合</button><button data-cat="oral">口语</button><button data-cat="verb">动词</button><button data-cat="core">高频</button></div><div id="flashPanel"><div class="flash" id="flashCard"><div><span class="pill" id="fCat"></span></div><div class="word"><span id="fWord"></span><button class="sound" onclick="speakCurrentWord()">🔊 发音</button></div><div class="root" id="fRoot"></div><div class="muted">先自己回忆意思，再翻卡</div><div class="meaning"><b id="fCn"></b><div class="scene" id="fScene"></div><div class="scene" id="fFeel"></div></div></div><div class="actions"><button class="secondary" onclick="revealCard()">翻卡</button><button class="primary" onclick="nextCard()">下一个</button></div><div class="memory"><button class="know" onclick="markCurrent('know')">会了</button><button class="fuzzy" onclick="markCurrent('fuzzy')">模糊</button><button class="dont" onclick="markCurrent('dont')">不会</button><span class="muted" id="markTip"></span></div></div>
<div id="quizPanel" style="display:none"><div class="word" id="qWord"></div><button class="sound" onclick="speakQuizWord()">🔊 发音</button><div class="q" id="qText"></div><div class="opts" id="qOpts"></div><div class="feedback" id="qFeedback"></div><div class="actions"><button class="secondary" onclick="toggleExplain()">显示解析</button><button class="primary" onclick="nextQuiz()">下一题</button></div><div class="explain" id="qExplain"></div></div></div></section>

<section id="reading" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2 id="rTitle"></h2><span class="pill" id="rLevel"></span></div><div class="actions" style="justify-content:flex-start;margin-top:0"><button class="secondary" onclick="speakReading()">🔊 朗读全文</button><button class="secondary" onclick="toggleTranslation()">显示 / 隐藏中文</button><button class="primary" onclick="nextReading()">下一篇</button></div><div class="readingText" id="rText"></div><div class="translation" id="rCn"></div><div class="vocabBox" id="rVocab"></div><div class="miniQ"><div class="q" id="rQ"></div><div class="opts" id="rOpts"></div><div class="feedback" id="rFeedback"></div></div></div></section>

<section id="affix" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>前后缀训练</h2><span class="pill">来自你的 Excel 规则表</span></div><div class="affixList" id="affixList"></div></div></section>
<section id="review" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>错词复习</h2><span class="pill" id="reviewCount"></span></div><div class="reviewList" id="reviewList"></div></div></section>
<section id="progress" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>学习记录</h2><button class="secondary" onclick="clearProgress()">清空记录</button></div><div class="progressList" id="progressList"></div></div></section>
</div>

let cardIndex=0,quizIndex=0,readingIndex=0,cat='all',vmode='flash',answered=false,done=0,correct=0;
const $=id=>document.getElementById(id);const memory=()=>JSON.parse(localStorage.getItem('indo_memory_v2')||'{}');const save=m=>localStorage.setItem('indo_memory_v2',JSON.stringify(m));
$('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(id==='review')renderReview();if(id==='progress')renderProgress()}window.go=go;
function filtered(){return cat==='all'?bank:bank.filter(x=>x.cat===cat)}
function current(){let a=filtered();return a[cardIndex%a.length]}
function speak(text){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='id-ID';let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('id'));if(v)u.voice=v;u.rate=.88;speechSynthesis.speak(u)}
function speakCurrentWord(){speak(current().w)}window.speakCurrentWord=speakCurrentWord;function speakQuizWord(){speak(filtered()[quizIndex%filtered().length].w)}window.speakQuizWord=speakQuizWord;
function renderCard(){let a=filtered();if(!a.length)return;cardIndex%=a.length;let x=a[cardIndex];$('flashCard').classList.remove('revealed');$('fWord').textContent=x.w;$('fRoot').textContent='词根 / 类型：'+x.root;$('fCn').textContent=x.cn;$('fScene').textContent='例句：'+x.scene;$('fFeel').textContent=x.feel;$('fCat').textContent=x.cat==='oral'?'口语':x.cat==='verb'?'动词':'高频';$('vCount').textContent=a.length+' 个';$('markTip').textContent=''}
function revealCard(){$('flashCard').classList.add('revealed')}window.revealCard=revealCard;function nextCard(){cardIndex++;renderCard()}window.nextCard=nextCard;
function markCurrent(v){let m=memory();m[current().w]=v;save(m);$('markTip').textContent='已标记：'+({know:'会了',fuzzy:'模糊',dont:'不会'}[v]);updateStats();renderReview()}window.markCurrent=markCurrent;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderQuiz(){let a=filtered();if(!a.length)return;quizIndex%=a.length;answered=false;let x=a[quizIndex],wrong=shuffle(bank.filter(y=>y.w!==x.w)).slice(0,3).map(y=>y.cn),opts=shuffle([x.cn,...wrong]);$('qWord').textContent=x.w;$('qText').textContent='“'+x.w+'” 最接近哪个意思？';$('qOpts').innerHTML='';$('qFeedback').className='feedback';$('qExplain').className='explain';$('qExplain').innerHTML='<b>'+x.w+'</b> = '+x.cn+'<br>词根 / 类型：'+x.root+'<br>例句：'+x.scene+'<br>'+x.feel;opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answerQuiz(o===x.cn,b,opts.indexOf(x.cn));$('qOpts').appendChild(b)})}
function answerQuiz(ok,b,ans){if(answered)return;answered=true;done++;[...$('qOpts').children].forEach((el,i)=>{if(i===ans)el.classList.add('good')});if(ok){correct++;$('qFeedback').className='feedback show good';$('qFeedback').textContent='回答正确 ✓'}else{b.classList.add('bad');$('qFeedback').className='feedback show bad';$('qFeedback').textContent='回答错误，正确答案已标绿。';let x=filtered()[quizIndex%filtered().length],m=memory();if(!m[x.w])m[x.w]='fuzzy';save(m)}updateStats()}
function nextQuiz(){quizIndex++;renderQuiz()}window.nextQuiz=nextQuiz;function toggleExplain(){$('qExplain').classList.toggle('show')}window.toggleExplain=toggleExplain;
function startQuiz(){go('vocab');vmode='quiz';document.querySelectorAll('[data-vmode]').forEach(b=>b.classList.toggle('active',b.dataset.vmode==='quiz'));$('flashPanel').style.display='none';$('quizPanel').style.display='block';renderQuiz()}window.startQuiz=startQuiz;function startDailyVocab(){go('vocab');vmode='flash';document.querySelectorAll('[data-vmode]').forEach(b=>b.classList.toggle('active',b.dataset.vmode==='flash'));$('flashPanel').style.display='block';$('quizPanel').style.display='none';renderCard()}window.startDailyVocab=startDailyVocab;
function renderReading(){let r=readings[readingIndex%readings.length];$('rTitle').textContent=r.title;$('rLevel').textContent=r.level;$('rText').textContent=r.text;$('rCn').textContent=r.cn;$('rCn').className='translation';$('rVocab').innerHTML=r.v.map(v=>'<div class="vocab"><b>'+v[0]+' <button class="sound" style="padding:4px 7px" onclick="speak(\''+v[0]+'\')">🔊</button></b><span class="muted">'+v[1]+'</span></div>').join('');$('rQ').textContent=r.q;$('rFeedback').className='feedback';$('rOpts').innerHTML='';r.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{[...$('rOpts').children].forEach((el,j)=>{if(j===r.ans)el.classList.add('good')});$('rFeedback').className='feedback show '+(i===r.ans?'good':'bad');$('rFeedback').textContent=i===r.ans?'回答正确 ✓':'回答错误，正确答案已标绿。'};$('rOpts').appendChild(b)})}
function speakReading(){speak(readings[readingIndex%readings.length].text)}window.speakReading=speakReading;function toggleTranslation(){$('rCn').classList.toggle('show')}window.toggleTranslation=toggleTranslation;function nextReading(){readingIndex++;renderReading()}window.nextReading=nextReading;window.speak=speak;
function renderAffix(){$('affixList').innerHTML=affixes.map(a=>'<div class="affix"><h3>'+a.t+'</h3><p>'+a.d+'</p><p><b>例：</b>'+a.e+'</p></div>').join('')}
function renderReview(){let m=memory(),arr=bank.filter(x=>m[x.w]==='fuzzy'||m[x.w]==='dont');$('reviewCount').textContent=arr.length+' 个';$('homeReview').textContent=arr.length+' 个待复习';$('reviewList').innerHTML=arr.length?arr.map(x=>'<div class="review"><b>'+x.w+' <button class="sound" style="padding:4px 7px" onclick="speak(\''+x.w+'\')">🔊</button></b><p>'+x.cn+' ｜ '+x.scene+'</p></div>').join(''):'<div class="empty">目前没有待复习词。学习时把词标记为“模糊”或“不会”，这里会自动出现。</div>'}
function renderProgress(){let m=memory(),arr=bank.filter(x=>m[x.w]);$('progressList').innerHTML=arr.length?arr.map(x=>'<div class="prog"><b>'+x.w+'</b><p>'+x.cn+' ｜ 掌握度：'+({know:'会了',fuzzy:'模糊',dont:'不会'}[m[x.w]])+'</p></div>').join(''):'<div class="empty">还没有学习记录。</div>'}
function updateStats(){let m=memory(),vals=Object.values(m);$('sDone').textContent=done;$('sRate').textContent=done?Math.round(correct/done*100)+'%':'0%';$('sKnow').textContent=vals.filter(v=>v==='know').length;$('sReview').textContent=vals.filter(v=>v==='fuzzy'||v==='dont').length;renderReview()}
function clearProgress(){if(confirm('确定清空本机学习记录吗？')){localStorage.removeItem('indo_memory_v2');updateStats();renderProgress()}}window.clearProgress=clearProgress;
document.querySelectorAll('[data-vmode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-vmode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');vmode=b.dataset.vmode;$('flashPanel').style.display=vmode==='flash'?'block':'none';$('quizPanel').style.display=vmode==='quiz'?'block':'none';if(vmode==='quiz')renderQuiz()});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;cardIndex=0;quizIndex=0;renderCard();renderQuiz()});
renderCard();renderQuiz();renderReading();renderAffix();renderReview();renderProgress();updateStats();
</script></body></html>
