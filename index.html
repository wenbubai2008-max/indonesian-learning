<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>印尼语学习</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e6e9ef;--accent:#3157d5;--soft:#eef3ff;--ok:#16803b;--warn:#a15c00;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.app{max-width:980px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:30px}.sub,.muted{color:var(--muted);font-size:14px}.date{color:var(--muted);font-size:14px}.page{display:none}.page.active{display:block}.back{border:0;background:transparent;color:var(--accent);font-weight:800;padding:0;margin-bottom:12px;cursor:pointer}.hero{background:linear-gradient(135deg,#3157d5,#5f7bea);color:#fff;border-radius:24px;padding:24px;margin:18px 0}.hero h2{margin:0 0 6px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.slot{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:15px}.slotTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.slotTime{font-size:21px;font-weight:850}.status{font-size:12px;font-weight:850;padding:5px 9px;border-radius:999px}.pending{background:#fff2d8;color:#8a4b00}.done{background:#e9f8ee;color:#126b32}.slot p{font-size:13px;line-height:1.55}.slot button,.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.slot button{background:#fff;color:#2445b7}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f6;color:#374151}.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.module{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;cursor:pointer}.module h3{margin:7px 0}.module p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:14px}.sectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.sectionTitle h2{margin:0}.pill{background:var(--soft);color:var(--accent);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.lessonSection{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.lessonSection:first-of-type{border-top:0;padding-top:0}.lessonSection h3{margin:0 0 10px}.wordRow{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px}.wordHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.wordHead b{font-size:18px}.sound{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;cursor:pointer}.example{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.55}.reading{font-size:17px;line-height:1.85;background:#fafbfe;border-radius:14px;padding:14px}.translation{display:none;margin-top:10px;background:#f7f8fb;border-radius:12px;padding:13px;line-height:1.7}.translation.show{display:block}.quiz{display:grid;gap:10px}.qbox{border:1px solid var(--line);border-radius:13px;padding:12px}.qbox button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;margin-top:7px;cursor:pointer}.qbox button.good{background:#eefaf1;border-color:#8fd3a4}.qbox button.bad{background:#fff2f0;border-color:#efaaa2}.answer{display:none;color:var(--muted);font-size:13px;margin-top:7px}.answer.show{display:block}.completeBar{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.completeBar strong{font-size:15px}.calendarHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendarHead button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:12px;padding:5px}.day{min-height:74px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer}.day.other{opacity:.35}.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.dayNum{font-weight:800}.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.dot{font-size:10px;padding:3px 5px;border-radius:999px}.dot.am{background:#eef3ff;color:#3157d5}.dot.pm{background:#f4ecff;color:#7a3eb1}.dot.done{background:#e9f8ee;color:#126b32}.calendarLegend{margin-top:10px;color:var(--muted);font-size:12px}.flash{min-height:280px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#fbfcff;border:1px solid var(--line);border-radius:20px;padding:24px}.word{font-size:34px;font-weight:850}.meaning{display:none;margin-top:15px;font-size:18px}.flash.revealed .meaning{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.reviewItem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
@media(max-width:650px){.top{flex-direction:column}.slots,.modules{grid-template-columns:1fr}.calendarGrid{gap:3px}.day{min-height:64px;padding:5px}.dot{font-size:9px}.card{padding:17px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><h1>🇮🇩 印尼语学习</h1><div class="sub">每日 08:00 + 19:00 · 实际学习内容 · 完成记录 · 日历回看</div></div><div class="date" id="todayText"></div></div>

<section id="home" class="page active">
<div class="hero"><h2>今日学习</h2><p>每天自动生成两套内容。学完后只点一次“我学完了”。</p><div class="slots"><div class="slot"><div class="slotTop"><span class="slotTime">08:00</span><span id="homeAmStatus" class="status pending">未学习</span></div><p>新词、句子、阅读、小测、输出与复习。</p><button onclick="openLesson('am')">进入早间学习 →</button></div><div class="slot"><div class="slotTop"><span class="slotTime">19:00</span><span id="homePmStatus" class="status pending">未学习</span></div><p>A2+–B1 词汇、词根词缀、造句、情景对话和复盘。</p><button onclick="openLesson('pm')">进入晚间学习 →</button></div></div></div>
<div class="modules"><button class="module" onclick="go('calendar')"><div>📅</div><h3>学习日历</h3><p>查看每天 08:00 / 19:00 是否完成，也可以点过去的日期回看当天内容。</p></button><button class="module" onclick="go('vocab')"><div>🧠</div><h3>词汇学习</h3><p>独立闪卡复习，带标准 id-ID 发音。</p></button><button class="module" onclick="go('reading')"><div>📖</div><h3>阅读短文</h3><p>随时额外做一篇 A2+ → B1 阅读。</p></button><button class="module" onclick="go('review')"><div>🔁</div><h3>错词复习</h3><p>把“模糊 / 不会”的词集中复习。</p></button></div>
</section>

<section id="lesson" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div id="lessonBox"></div></section>

<section id="calendar" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="calendarHead"><button onclick="changeMonth(-1)">←</button><h2 id="monthTitle"></h2><button onclick="changeMonth(1)">→</button></div><div class="calendarGrid" id="calendarGrid"></div><div class="calendarLegend">绿色 = 已完成；蓝色 AM / 紫色 PM = 当天有学习内容但未完成。点击日期可回看。</div></div></section>

<section id="vocab" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>词汇闪卡</h2><span class="pill">独立复习</span></div><div class="flash" id="flash"><div class="word"><span id="fw"></span> <button class="sound" onclick="speak(currentVocab().w)">🔊</button></div><div class="muted" id="froot"></div><div class="meaning"><b id="fcn"></b><div class="example" id="fex"></div></div></div><div class="actions"><button class="secondary" onclick="reveal()">翻卡</button><button class="primary" onclick="nextFlash()">下一个</button><button class="secondary" onclick="markFlash('fuzzy')">模糊</button><button class="secondary" onclick="markFlash('dont')">不会</button></div></div></section>

<section id="reading" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>额外阅读</h2><span class="pill">A2+ → B1</span></div><div id="extraReading" class="reading"></div><div class="actions"><button class="secondary" onclick="speak(document.getElementById('extraReading').textContent)">🔊 朗读全文</button></div></div></section>

<section id="review" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionTitle"><h2>错词复习</h2><span class="pill" id="reviewCount"></span></div><div id="reviewList"></div></div></section>
</div>
<script>
const vocab=[
{w:'soalnya',cn:'因为嘛 / 因为',root:'口语连接词',ex:'Gak jadi, soalnya hujan.'},{w:'padahal',cn:'明明 / 可是其实',root:'连接词',ex:'Padahal tadi dia bilang mau datang.'},{w:'ternyata',cn:'原来 / 结果发现',root:'nyata',ex:'Ternyata harganya lebih mahal.'},{w:'kebetulan',cn:'碰巧 / 正好',root:'betul',ex:'Kebetulan saya lagi di dekat sini.'},{w:'lumayan',cn:'还不错 / 挺……的',root:'口语副词',ex:'Hasilnya lumayan bagus.'},{w:'memastikan',cn:'确认 / 确保',root:'pasti',ex:'Saya mau memastikan jadwalnya dulu.'},{w:'mengatasi',cn:'解决 / 应对 / 克服',root:'atas',ex:'Kita harus cari cara buat mengatasi masalah ini.'},{w:'menentukan',cn:'确定 / 决定',root:'tentu',ex:'Kita belum menentukan tanggalnya.'},{w:'menyelesaikan',cn:'完成 / 解决',root:'selesai',ex:'Saya harus menyelesaikan pekerjaan ini hari ini.'},{w:'menyadari',cn:'意识到',root:'sadar',ex:'Saya baru menyadari kalau saya salah.'},{w:'mendadak',cn:'突然 / 临时',root:'形容词',ex:'Ada meeting mendadak sore ini.'},{w:'lega',cn:'松一口气 / 放心',root:'形容词',ex:'Akhirnya saya lega.'},{w:'gugup',cn:'紧张',root:'形容词',ex:'Saya sempat gugup sebelum presentasi.'},{w:'beres',cn:'搞定 / 完事',root:'口语高频',ex:'Kalau udah beres, kabarin saya.'},{w:'ngaret',cn:'拖延 / 晚点',root:'雅加达口语',ex:'Meeting-nya ngaret setengah jam.'},{w:'bakal',cn:'将会 / 会',root:'口语',ex:'Besok kayaknya bakal hujan.'},{w:'ketemu',cn:'见面 / 碰到',root:'口语 bentuk dari bertemu',ex:'Nanti kita ketemu di lobby aja.'},{w:'pantes',cn:'怪不得 / 难怪',root:'口语',ex:'Pantes dia capek banget.'},{w:'berusaha',cn:'努力 / 尝试',root:'usaha',ex:'Saya akan berusaha menyelesaikannya hari ini.'},{w:'terbiasa',cn:'习惯于',root:'biasa',ex:'Saya belum terbiasa ngomong cepat.'}
];
const sentences=[
['Nanti malam jadi makan bareng nggak?','今晚还一起吃饭吗？'],['Gimana kalau kita makan di luar aja?','要不我们就在外面吃吧？'],['Saya mau memastikan jadwal meeting besok.','我想确认一下明天会议的时间。'],['Kebetulan saya lagi di dekat sini.','正好我现在就在这附近。'],['Padahal tadi dia bilang mau datang.','明明刚才他说要来的。'],['Kalau udah beres, kabarin saya ya.','如果搞定了告诉我一下。'],['Meeting-nya ngaret setengah jam.','会议晚了半小时。'],['Pantes dari tadi dia diem aja.','怪不得他从刚才开始一直不说话。'],['Kayaknya besok bakal lebih sibuk.','感觉明天会更忙。'],['Saya belum terbiasa ngomong secepat itu.','我还不习惯说那么快。']
];
const readings=[
{title:'Meeting Mendadak',id:'Pagi ini saya datang ke kantor agak terlambat karena jalanan macet. Ternyata bos sudah menunggu dan ada meeting mendadak dengan tim. Saya langsung memastikan semua dokumen sudah siap. Untungnya, teman saya sudah bantu cek beberapa data. Kami membahas masalah pelanggan dan mencoba mencari cara buat mengatasinya. Setelah meeting selesai, bos bilang hasilnya lumayan bagus, tapi masih ada beberapa hal yang harus diperbaiki. Saya sempat gugup, tapi akhirnya lega karena semua berjalan lebih lancar dari yang saya kira.',cn:'今天早上因为堵车，我到办公室稍微晚了一点。结果老板已经在等了，而且团队突然有个临时会议。我马上确认所有文件都准备好了。幸运的是，同事已经帮我检查了一些数据。我们讨论客户的问题，并尝试寻找解决办法。会议结束后，老板说结果还不错，但仍有一些地方需要改进。我一度有点紧张，不过最后松了口气，因为一切比我原先想的更顺利。'},
{title:'Janjian Setelah Kerja',id:'Sore ini saya janjian ketemu teman setelah kerja. Awalnya kami mau makan jam tujuh, tapi ternyata dia masih ada urusan di kantor. Dia bilang meeting-nya ngaret dan mungkin baru beres sekitar jam delapan. Saya bilang nggak apa-apa, soalnya saya juga belum terlalu lapar. Akhirnya kami sepakat ketemu di tempat yang lebih dekat dari kantornya. Pas sampai sana, tempatnya lumayan ramai, tapi untung masih ada meja kosong. Kami ngobrol santai sampai hampir jam sepuluh.',cn:'今天傍晚我约了朋友下班后见面。原本我们想七点吃饭，但结果他办公室还有事。他说会议拖延了，可能八点左右才结束。我说没关系，因为我也不是特别饿。最后我们决定在离他办公室更近的地方见面。到了那里以后，人还挺多，不过幸运的是还有空桌。我们轻松聊天一直聊到快十点。'}
];
const affixNotes=[['mengatasi','atas','meng- + atas + -i → mengatasi，解决 / 应对'],['menentukan','tentu','meN- + tentu + -kan → menentukan，确定 / 决定'],['menyelesaikan','selesai','meN- + selesai + -kan → menyelesaikan，完成 / 解决'],['menyadari','sadar','meN- + sadar + -i → menyadari，意识到']];
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function todayKey(){return keyOf(new Date())}function seedOf(k){return k.split('-').join('')*1}function pick(arr,start,n){let out=[];for(let i=0;i<n;i++)out.push(arr[(start+i)%arr.length]);return out}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}window.go=go;
$('todayText').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
function speak(text){if(!('speechSynthesis'in window))return alert('当前浏览器不支持语音朗读');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.9;speechSynthesis.speak(u)}window.speak=speak;
function record(k){return JSON.parse(localStorage.getItem('study_'+k)||'{"am":false,"pm":false}')}function saveRecord(k,r){localStorage.setItem('study_'+k,JSON.stringify(r))}
function lessonFor(k,type){let seed=seedOf(k)+(type==='pm'?7:0),words=pick(vocab,seed%vocab.length,type==='am'?10:12),sents=pick(sentences,seed%sentences.length,5),read=readings[seed%readings.length];return{words,sents,read,affix:pick(affixNotes,seed%affixNotes.length,3)}}
function openLesson(type,k=todayKey()){renderLesson(k,type);go('lesson')}window.openLesson=openLesson;
function renderLesson(k,type){let L=lessonFor(k,type),r=record(k),isDone=r[type];let title=type==='am'?'08:00 早间学习':'19:00 晚间学习';let html='<div class="card"><div class="sectionTitle"><h2>'+title+'</h2><span class="status '+(isDone?'done':'pending')+'">'+(isDone?'已完成':'未完成')+'</span></div><div class="muted">'+k+' · '+(type==='am'?'输入 + 新词 + 阅读 + 小测':'主动使用 + 词根词缀 + 输出训练')+'</div>';
html+='<div class="lessonSection"><h3>① 词汇</h3>'+L.words.map((x,i)=>'<div class="wordRow"><div class="wordHead"><b>'+(i+1)+'. '+x.w+'｜'+x.cn+'</b><button class="sound" onclick="speak(\''+x.w+'\')">🔊</button></div><div class="example">词根/类型：'+x.root+'<br>'+x.ex+'</div></div>').join('')+'</div>';
html+='<div class="lessonSection"><h3>② 句子</h3>'+L.sents.map((x,i)=>'<div class="wordRow"><div class="wordHead"><b>'+(i+1)+'. '+x[0]+'</b><button class="sound" onclick="speak(\''+x[0].replace(/'/g,"\\'")+'\')">🔊</button></div><div class="example">'+x[1]+'</div></div>').join('')+'</div>';
if(type==='pm')html+='<div class="lessonSection"><h3>③ 词根 / 词缀</h3>'+L.affix.map(x=>'<div class="wordRow"><b>'+x[0]+' ← '+x[1]+'</b><div class="example">'+x[2]+'</div></div>').join('')+'</div>';
html+='<div class="lessonSection"><h3>'+(type==='am'?'③':'④')+' 阅读</h3><div class="sectionTitle"><b>'+L.read.title+'</b><button class="sound" onclick="speak(\''+L.read.id.replace(/'/g,"\\'")+'\')">🔊 全文</button></div><div class="reading">'+L.read.id+'</div><div class="actions"><button class="secondary" onclick="this.parentElement.nextElementSibling.classList.toggle(\'show\')">显示 / 隐藏中文</button></div><div class="translation">'+L.read.cn+'</div></div>';
let quizWords=L.words.slice(0,3);html+='<div class="lessonSection"><h3>'+(type==='am'?'④':'⑤')+' 小测</h3><div class="quiz">'+quizWords.map((x,i)=>{let wrong=pick(vocab.filter(v=>v.w!==x.w),i+seedOf(k),3).map(v=>v.cn),opts=[x.cn,...wrong].sort(()=>Math.random()-.5);return '<div class="qbox"><b>'+(i+1)+'. “'+x.w+'” 是什么意思？</b>'+opts.map(o=>'<button onclick="checkQ(this,'+(o===x.cn)+')">'+o+'</button>').join('')+'<div class="answer">答案：'+x.cn+'</div></div>'}).join('')+'</div></div>';
html+='<div class="lessonSection"><h3>'+(type==='am'?'⑤':'⑥')+' 输出练习</h3><div class="wordRow"><b>'+(type==='am'?'请用今天任意 2 个新词说 1–3 句。':'请把下面句子改成更自然的雅加达口语：Saya belum selesai, karena rapatnya terlambat.')+'</b><div class="example">参考答案：'+(type==='am'?'Ternyata meeting-nya ngaret, jadi saya agak gugup. Tapi akhirnya semua beres dan saya lega.':'Belum beres nih, soalnya meeting-nya ngaret.')+'</div></div></div>';
html+='<div class="completeBar"><div><strong>学完这一整套后再标记</strong><div class="muted">完成记录会显示在学习日历里。</div></div><button class="primary" onclick="completeLesson(\''+k+'\',\''+type+'\')">'+(isDone?'已完成 ✓':'我学完了')+'</button></div></div>';$('lessonBox').innerHTML=html}
function checkQ(btn,ok){let box=btn.parentElement;box.querySelectorAll('button').forEach(b=>b.disabled=true);btn.classList.add(ok?'good':'bad');if(!ok){[...box.querySelectorAll('button')].forEach(b=>{if(b.textContent===box.querySelector('.answer').textContent.replace('答案：',''))b.classList.add('good')})}box.querySelector('.answer').classList.add('show')}window.checkQ=checkQ;
function completeLesson(k,type){let r=record(k);r[type]=true;saveRecord(k,r);renderLesson(k,type);updateHome();renderCalendar()}window.completeLesson=completeLesson;
function updateHome(){let r=record(todayKey());[['Am','am'],['Pm','pm']].forEach(([id,t])=>{let el=$('home'+id+'Status');el.textContent=r[t]?'已完成':'未学习';el.className='status '+(r[t]?'done':'pending')})}
let calDate=new Date();calDate.setDate(1);function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}window.changeMonth=changeMonth;function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth();$('monthTitle').textContent=y+'年 '+(m+1)+'月';let g=$('calendarGrid');g.innerHTML=['一','二','三','四','五','六','日'].map(x=>'<div class="dow">'+x+'</div>').join('');let first=new Date(y,m,1),offset=(first.getDay()+6)%7,start=new Date(y,m,1-offset);for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=keyOf(d),r=record(k),other=d.getMonth()!==m,today=k===todayKey();let div=document.createElement('div');div.className='day'+(other?' other':'')+(today?' today':'');div.innerHTML='<div class="dayNum">'+d.getDate()+'</div><div class="dots"><span class="dot '+(r.am?'done':'am')+'">AM '+(r.am?'✓':'')+'</span><span class="dot '+(r.pm?'done':'pm')+'">PM '+(r.pm?'✓':'')+'</span></div>';div.onclick=()=>openLesson('am',k);g.appendChild(div)}}
let fi=0;function currentVocab(){return vocab[fi%vocab.length]}function renderFlash(){let x=currentVocab();$('flash').classList.remove('revealed');$('fw').textContent=x.w;$('froot').textContent='词根 / 类型：'+x.root;$('fcn').textContent=x.cn;$('fex').textContent=x.ex}function reveal(){$('flash').classList.add('revealed')}function nextFlash(){fi++;renderFlash()}function markFlash(v){let m=JSON.parse(localStorage.getItem('indo_mem')||'{}');m[currentVocab().w]=v;localStorage.setItem('indo_mem',JSON.stringify(m));renderReview();nextFlash()}window.reveal=reveal;window.nextFlash=nextFlash;window.markFlash=markFlash;
function renderReview(){let m=JSON.parse(localStorage.getItem('indo_mem')||'{}'),arr=vocab.filter(x=>m[x.w]==='fuzzy'||m[x.w]==='dont');$('reviewCount').textContent=arr.length+' 个';$('reviewList').innerHTML=arr.length?arr.map(x=>'<div class="reviewItem"><b>'+x.w+'｜'+x.cn+'</b><button class="sound" onclick="speak(\''+x.w+'\')">🔊</button><div class="example">'+x.ex+'</div></div>').join(''):'<div class="muted">目前没有待复习词。</div>'}
$('extraReading').textContent=readings[1].id;renderFlash();renderReview();updateHome();renderCalendar();
</script></body></html>
