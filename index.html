<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>印尼语学习</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e9f1;--blue:#3157d5;--soft:#eef3ff;--ok:#16803b;--warn:#a15c00;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{max-width:1000px;margin:auto;padding:24px 16px 70px}.top{display:flex;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:30px}.muted{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat,.card,.module{background:#fff;border:1px solid var(--line)}.stat{border-radius:16px;padding:14px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:3px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,#3157d5,#5f7bea);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.slot{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.27);border-radius:16px;padding:14px}.slotHead{display:flex;justify-content:space-between;align-items:center}.slotTime{font-size:20px;font-weight:850}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#fff2d8;color:#8a4b00}.status.done{background:#e9f8ee;color:#126b32}.status.ready{background:#fff;color:#3157d5}.slot button{border:0;background:#fff;color:#2445b7;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.module{border-radius:20px;padding:18px;text-align:left;cursor:pointer}.module h3{margin:7px 0 5px}.module p{margin:0;color:var(--muted);line-height:1.5}.tag,.pill{display:inline-block;background:var(--soft);color:var(--blue);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-top:9px}.card{border-radius:22px;padding:22px}.back{border:0;background:transparent;color:var(--blue);font-weight:750;cursor:pointer;margin-bottom:12px}.sectionHead{display:flex;justify-content:space-between;align-items:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px}.primary,.secondary,.sound{border:0;border-radius:11px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eef1f6}.sound{background:#fff;border:1px solid var(--line);padding:7px 10px}.flash{min-height:310px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#fbfcff;border:1px solid var(--line);border-radius:20px;padding:24px}.word{font-size:36px;font-weight:850}.meaning{display:none;margin-top:17px;font-size:19px;line-height:1.65}.flash.revealed .meaning{display:block}.actions,.memory{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:13px}.memory{border-top:1px solid var(--line);padding-top:13px}.memory button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px}.q{font-size:19px;font-weight:750;margin:14px 0}.opts{display:grid;gap:9px}.opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}.opt.good{background:#eefaf1}.opt.bad{background:#fff2f0}.error{background:#fff2f0;color:var(--bad);padding:14px;border-radius:12px}.diag{font-size:12px;color:#7c2d12;margin-top:8px;word-break:break-all}.loading,.empty{text-align:center;color:var(--muted);padding:34px}.contentSection{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.contentSection:first-child{border-top:0}.vocabRow,.item{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.reading{font-size:18px;line-height:1.9}.answer{background:#f7f8fb;border-radius:11px;padding:11px;margin-top:8px}.calendarNav{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:12px}.day{min-height:72px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}.day.today{border-color:var(--blue)}.day.blank{visibility:hidden}.dotDone{color:var(--ok)}.dotReady{color:var(--blue)}.affixTitle{font-weight:850;font-size:17px;margin:15px 0 8px}@media(max-width:650px){.top{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.modules,.slots{grid-template-columns:1fr}.card{padding:17px}.word{font-size:31px}}
</style>
</head>
<body><div class="app">
<div class="top"><div><h1>🇮🇩 印尼语学习</h1><div class="muted">A2+ → B1 · 雅加达真实口语优先 · 你的个人词库</div></div><div class="muted" id="todayLabel"></div></div>
<div class="stats"><div class="stat"><span>词库</span><b id="vocabCount">加载中</b></div><div class="stat"><span>已掌握</span><b id="knownCount">0</b></div><div class="stat"><span>待复习</span><b id="reviewCount">0</b></div><div class="stat"><span>今日完成</span><b id="sessionCount">0 / 2</b></div></div>
<section id="home" class="page active"><div class="hero"><h2>今日学习</h2><div style="opacity:.9">每天 08:00 / 19:00 自动生成到网站。学完后只点一次“我学完了”。</div><div class="slots"><div class="slot"><div class="slotHead"><span class="slotTime">08:00</span><span id="amStatus" class="status">待生成</span></div><p>10新词 · 5句 · 阅读 · 小测 · 输出 · 复习</p><button onclick="openDaily('am')">打开早间学习 →</button></div><div class="slot"><div class="slotHead"><span class="slotTime">19:00</span><span id="pmStatus" class="status">待生成</span></div><p>重点词 · 词形训练 · 输出 · 短文 · 对话 · 复盘</p><button onclick="openDaily('pm')">打开晚间学习 →</button></div></div></div><div class="modules"><button class="module" onclick="go('vocab')"><div>🧠</div><h3>词汇学习</h3><p>Excel 合并词库；搜索、分类、闪卡、选择题、发音。</p><span class="tag" id="vocabTag">加载中...</span></button><button class="module" onclick="goReading()"><div>📖</div><h3>阅读短文</h3><p>直接使用当天每日学习中的短文。</p><span class="tag">每日同步</span></button><button class="module" onclick="go('affix')"><div>🧩</div><h3>前后缀</h3><p>meN-、peN-、ber-、di-、ter-、-kan、-i 等。</p><span class="tag">Excel规则</span></button><button class="module" onclick="go('calendar')"><div>📅</div><h3>学习日历</h3><p>查看每天早晚内容与完成情况。</p><span class="tag">历史归档</span></button><button class="module" onclick="go('review')"><div>🔁</div><h3>错词复习</h3><p>“模糊 / 不会”的词自动进入。</p><span class="tag" id="reviewTag">0 个</span></button></div></section>
<section id="daily" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2 id="dailyTitle">每日学习</h2><span id="dailyMeta" class="pill"></span></div><div id="dailyBody" class="loading">加载中…</div></div></section>
<section id="vocab" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>词汇学习</h2><span id="dbStatus" class="pill">加载中</span></div><div class="toolbar"><input id="search" placeholder="搜索印尼语 / 中文 / 英文" oninput="applyFilter()"><select id="cat" onchange="applyFilter()"><option value="">全部分类</option></select><select id="mode" onchange="renderVocab()"><option value="flash">闪卡</option><option value="quiz">选择题</option></select><button class="secondary" onclick="loadDB()">重新加载词库</button></div><div id="vocabBox" class="loading">正在读取词库…</div></div></section>
<section id="readingPage" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>今日阅读</h2><span id="readingMeta" class="pill"></span></div><div class="toolbar"><button class="secondary" onclick="loadReading('am')">08:00短文</button><button class="secondary" onclick="loadReading('pm')">19:00短文</button></div><div id="readingBody" class="loading">读取中…</div></div></section>
<section id="affix" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>前后缀</h2><span class="pill">Excel原始规则</span></div><div id="affixBody" class="loading">加载中…</div></div></section>
<section id="review" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>错词复习</h2><span id="reviewMeta" class="pill"></span></div><div id="reviewBody"></div></div></section>
<section id="calendar" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>学习日历</h2><span class="pill">AM / PM</span></div><div class="calendarNav"><button class="secondary" onclick="moveMonth(-1)">←</button><b id="monthLabel"></b><button class="secondary" onclick="moveMonth(1)">→</button></div><div id="cal" class="cal"></div></div></section>
</div>
<script src="data/vocab-data.js?v=715"></script>
<script>
const BASE='/indonesian-learning/';const $=id=>document.getElementById(id);let DB=[],FILTER=[],idx=0,archive={dates:[]},affixes=[],calDate=new Date();
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}const TODAY=today();$('todayLabel').textContent=TODAY;
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);if(id==='calendar')renderCalendar();if(id==='review')renderReview()}window.go=go;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function xhrText(path){return new Promise((resolve,reject)=>{const u=BASE+path+'?v='+Date.now();const x=new XMLHttpRequest();x.open('GET',u,true);x.timeout=15000;x.onload=()=>{if(x.status>=200&&x.status<300)resolve(x.responseText);else reject(new Error('HTTP '+x.status+' '+u))};x.onerror=()=>reject(new Error('XHR network error '+u));x.ontimeout=()=>reject(new Error('XHR timeout '+u));x.send()})}
async function fetchText(path){return xhrText(path)}
async function fetchJSON(path){const t=await xhrText(path);try{return JSON.parse(t)}catch(e){throw new Error('JSON解析失败 '+path+'：'+e.message)}}
function loadDB(){
  try{
    DB = Array.isArray(window.EMBEDDED_DB) ? window.EMBEDDED_DB : [];
    if(!DB.length) throw new Error('715词词库脚本未加载');
    FILTER=DB.slice();
    $('vocabCount').textContent=DB.length;
    $('vocabTag').textContent=DB.length+' 个词条';
    $('dbStatus').textContent=DB.length+' 个词条';
    const cats=[...new Set(DB.flatMap(x=>x.categories||[]))].sort();
    $('cat').innerHTML='<option value="">全部分类</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');
    idx=0; renderVocab(); updateStats();
  }catch(e){
    $('vocabCount').textContent='失败';
    $('dbStatus').textContent='加载失败';
    $('vocabBox').innerHTML='<div class="error"><b>词库加载失败</b><div>'+esc(e.message)+'</div></div>';
  }
}
window.loadDB=loadDB;
function current(){return FILTER[idx%Math.max(FILTER.length,1)]||null}function speak(t){if(!t)return;const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}window.speak=speak;
function applyFilter(){const q=$('search').value.trim().toLowerCase(),c=$('cat').value;FILTER=DB.filter(x=>!(x.categories||[]).includes('粗口/俚语')&&(!c||(x.categories||[]).includes(c))&&(!q||[x.word,x.cn,x.en,x.root].join(' ').toLowerCase().includes(q)));idx=0;renderVocab()}window.applyFilter=applyFilter;
function renderVocab(){if(!FILTER.length){$('vocabBox').innerHTML='<div class="empty">没有匹配词汇</div>';return}const x=current();if($('mode').value==='quiz'){const others=FILTER.filter(y=>y.word!==x.word&&y.cn).sort(()=>Math.random()-.5).slice(0,3);const opts=[x,...others].sort(()=>Math.random()-.5);$('vocabBox').innerHTML='<div class="q">“'+esc(x.word)+'” 最接近哪个意思？ <button class="sound" onclick="speak('+JSON.stringify(x.word)+')">🔊</button></div><div class="opts">'+opts.map(o=>'<button class="opt" onclick="answerQuiz(this,'+JSON.stringify(o.word===x.word)+')">'+esc(o.cn||o.en||'—')+'</button>').join('')+'</div><div class="actions"><button class="primary" onclick="nextWord()">下一题</button></div>'}else{$('vocabBox').innerHTML='<div id="flash" class="flash"><div class="word">'+esc(x.word)+' <button class="sound" onclick="speak('+JSON.stringify(x.word)+')">🔊</button></div><div class="muted">'+esc(x.root?'词根：'+x.root:(x.categories||[]).join(' · '))+'</div><div class="meaning"><b>'+esc(x.cn||'暂无中文')+'</b><div class="muted">'+esc(x.en||'')+'</div><div style="margin-top:10px">'+esc(x.scene||'')+'</div><div class="muted">'+esc(x.note||'')+'</div></div></div><div class="actions"><button class="secondary" onclick="document.getElementById(\'flash\').classList.add(\'revealed\')">翻卡</button><button class="primary" onclick="nextWord()">下一个</button></div><div class="memory"><button onclick="mark(\'know\')">会了</button><button onclick="mark(\'fuzzy\')">模糊</button><button onclick="mark(\'dont\')">不会</button></div>'}}
window.renderVocab=renderVocab;function nextWord(){idx=(idx+1)%FILTER.length;renderVocab()}window.nextWord=nextWord;function answerQuiz(el,ok){el.classList.add(ok?'good':'bad');if(ok)el.textContent+=' ✓'}window.answerQuiz=answerQuiz;
function memory(){return JSON.parse(localStorage.getItem('indo_mem')||'{}')}function mark(v){const x=current();let m=memory();m[x.word]=v;localStorage.setItem('indo_mem',JSON.stringify(m));updateStats();renderReview();nextWord()}window.mark=mark;
function updateStats(){const vals=Object.values(memory());$('knownCount').textContent=vals.filter(v=>v==='know').length;$('reviewCount').textContent=vals.filter(v=>v==='fuzzy'||v==='dont').length;$('reviewTag').textContent=vals.filter(v=>v==='fuzzy'||v==='dont').length+' 个';$('sessionCount').textContent=(Number(localStorage.getItem('done_'+TODAY+'_am')==='1')+Number(localStorage.getItem('done_'+TODAY+'_pm')==='1'))+' / 2'}
function renderReview(){const m=memory(),arr=DB.filter(x=>m[x.word]==='fuzzy'||m[x.word]==='dont');$('reviewMeta').textContent=arr.length+' 个';$('reviewBody').innerHTML=arr.length?arr.map(x=>'<div class="item"><b>'+esc(x.word)+'</b> <button class="sound" onclick="speak('+JSON.stringify(x.word)+')">🔊</button><div>'+esc(x.cn)+'</div></div>').join(''):'<div class="empty">暂无待复习词</div>'}
async function loadArchive(){try{archive=await fetchJSON('data/daily/index.json')}catch(e){archive={dates:[]}}updateHome()}
function archiveRow(d){return (archive.dates||[]).find(x=>(typeof x==='string'?x:x.date)===d)||null}function hasSession(d,s){const r=archiveRow(d);if(!r)return false;return typeof r==='string'?false:!!r[s]}function isDone(d,s){return localStorage.getItem('done_'+d+'_'+s)==='1'}
function updateHome(){['am','pm'].forEach(s=>{const el=$(s+'Status');if(isDone(TODAY,s)){el.textContent='已完成';el.className='status done'}else if(hasSession(TODAY,s)){el.textContent='已生成';el.className='status ready'}else{el.textContent='待生成';el.className='status'}});updateStats()}
async function openDaily(s,d=TODAY){go('daily');$('dailyTitle').textContent=(s==='am'?'08:00 早间学习':'19:00 晚间学习');$('dailyMeta').textContent=d;$('dailyBody').innerHTML='<div class="loading">加载中…</div>';try{const x=await fetchJSON('data/daily/'+d+'-'+s+'.json');let h='';if(x.vocab?.length)h+='<div class="contentSection"><h3>词汇</h3>'+x.vocab.map(v=>'<div class="vocabRow"><b>'+esc(v.display||v.word)+'</b> <button class="sound" onclick="speak('+JSON.stringify(v.audio_text||v.word)+')">🔊</button><div>'+esc(v.cn)+'</div><div class="muted">'+esc(v.root?'词根：'+v.root:'')+' '+esc(v.formation||'')+'</div><div>'+esc(v.example||'')+'</div><div class="muted">'+esc(v.example_cn||'')+'</div></div>').join('')+'</div>';if(x.sentences?.length)h+='<div class="contentSection"><h3>句子</h3>'+x.sentences.map(v=>'<div class="item"><div>'+esc(v.id||v.text||'')+'</div><div class="muted">'+esc(v.cn||'')+'</div></div>').join('')+'</div>';if(x.reading)h+='<div class="contentSection"><h3>阅读：'+esc(x.reading.title||'')+'</h3><div class="reading">'+esc(x.reading.text||'')+'</div><div class="answer">'+esc(x.reading.cn||'')+'</div></div>';if(x.quiz?.length)h+='<div class="contentSection"><h3>小测</h3>'+x.quiz.map((q,i)=>'<div class="item"><b>'+(i+1)+'. '+esc(q.question)+'</b><div>'+q.options.map((o,j)=>String.fromCharCode(65+j)+'. '+esc(o)).join('<br>')+'</div><div class="answer">答案：'+String.fromCharCode(65+(q.answer_index||0))+'｜'+esc(q.explain||'')+'</div></div>').join('')+'</div>';if(x.output)h+='<div class="contentSection"><h3>主动输出</h3><div class="item">'+esc(x.output.task||'')+'<div class="answer">参考：'+esc(x.output.reference_answer||'')+'<br>'+esc(x.output.reference_cn||'')+'</div></div></div>';if(x.rewrite?.length)h+='<div class="contentSection"><h3>造句 / 改写</h3>'+x.rewrite.map(r=>'<div class="item">'+esc(r.task)+'<div class="answer">'+esc(r.reference_answer)+'<br>'+esc(r.reference_cn||'')+'</div></div>').join('')+'</div>';if(x.dialogue?.lines)h+='<div class="contentSection"><h3>情景对话</h3>'+x.dialogue.lines.map(l=>'<div class="item"><b>'+esc(l.speaker)+':</b> '+esc(l.id)+'<div class="muted">'+esc(l.cn||'')+'</div></div>').join('')+'</div>';h+='<div class="contentSection" style="text-align:center"><button class="primary" onclick="completeSession('+JSON.stringify(d)+','+JSON.stringify(s)+')">'+(isDone(d,s)?'✓ 已学完':'我学完了')+'</button></div>';$('dailyBody').innerHTML=h||'<div class="empty">当天内容为空</div>'}catch(e){$('dailyBody').innerHTML='<div class="error">当天内容暂未生成<div class="diag">'+esc(e.message)+'</div></div>'}}
window.openDaily=openDaily;function completeSession(d,s){localStorage.setItem('done_'+d+'_'+s,'1');updateHome();openDaily(s,d)}window.completeSession=completeSession;
function goReading(){go('readingPage');loadReading('am')}window.goReading=goReading;async function loadReading(s){$('readingBody').innerHTML='<div class="loading">读取中…</div>';try{const x=await fetchJSON('data/daily/'+TODAY+'-'+s+'.json');if(!x.reading)throw new Error('无短文');$('readingMeta').textContent=s==='am'?'08:00':'19:00';$('readingBody').innerHTML='<h3>'+esc(x.reading.title||'')+'</h3><div class="reading">'+esc(x.reading.text||'')+'</div><div class="actions"><button class="secondary" onclick="speak('+JSON.stringify(x.reading.text||'')+')">🔊 朗读全文</button></div><div class="answer">'+esc(x.reading.cn||'')+'</div>'}catch(e){$('readingBody').innerHTML='<div class="empty">该时段短文尚未生成</div>'}}window.loadReading=loadReading;
async function loadAffixes(){try{affixes=await fetchJSON('data/affixes.json');let h='';affixes.forEach(x=>{if(x.type==='section')h+='<div class="affixTitle">'+esc(x.title)+'</div>';else if(x.variant!=='变体形行')h+='<div class="item"><b>'+esc(x.variant||x.class)+'</b>｜'+esc(x.class)+'<div>'+esc(x.example)+'</div><div class="muted">'+esc(x.rule)+'</div></div>'});$('affixBody').innerHTML=h}catch(e){$('affixBody').innerHTML='<div class="error">前后缀加载失败<div class="diag">'+esc(e.message)+'</div></div>'}}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();$('monthLabel').textContent=y+'年 '+(m+1)+'月';let h=['日','一','二','三','四','五','六'].map(x=>'<div class="dow">'+x+'</div>').join('');const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<start;i++)h+='<div class="day blank"></div>';for(let n=1;n<=days;n++){const d=fmtDate(new Date(y,m,n));let dots='';for(const s of ['am','pm'])if(hasSession(d,s))dots+='<div class="'+(isDone(d,s)?'dotDone':'dotReady')+'">'+s.toUpperCase()+' '+(isDone(d,s)?'✓':'●')+'</div>';h+='<button class="day '+(d===TODAY?'today':'')+'" onclick="calendarDay('+JSON.stringify(d)+')"><b>'+n+'</b>'+dots+'</button>'}$('cal').innerHTML=h}function moveMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}window.moveMonth=moveMonth;function calendarDay(d){if(hasSession(d,'am'))openDaily('am',d);else if(hasSession(d,'pm'))openDaily('pm',d)}window.calendarDay=calendarDay;
loadDB();loadArchive();loadAffixes();updateStats();
</script><script src="data/daily-vocab-data.js?v=1"></script><script src="data/library-switcher.js?v=1"></script><script src="data/history-layout.js?v=2"></script><script src="data/history-v2.js?v=1"></script><script src="data/pronunciation-fix.js?v=20260831-2"></script>
</body></html>
