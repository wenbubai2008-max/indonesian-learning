name: Audit weakness runtime 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-weakness-runtime2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch history refresh and cache versions
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/home-modules-layout.js')
          s=p.read_text()
          marker="  function installHistoryNavigation(){\n    if(window.__indoHistoryNavInstalled||typeof window.go!=='function')return;"
          helper="  function refreshHistoryPage(id){\n    if(id==='weakness'&&typeof window.openWeaknessV2==='function'){\n      setTimeout(function(){\n        if(currentPage()==='weakness')window.openWeaknessV2();\n      },0);\n    }\n  }\n\n"
          if 'function refreshHistoryPage(' not in s:
              if marker not in s: raise SystemExit('history marker not found')
              s=s.replace(marker,helper+marker)
          s=s.replace("    if(wanted!==initial)renderPage(wanted);\n","    if(wanted!==initial)renderPage(wanted);\n    if(wanted!==initial)refreshHistoryPage(wanted);\n")
          old="    window.addEventListener('popstate',function(e){\n      const st=e.state;\n      if(st&&st.__indoSite&&st.page)renderPage(st.page);\n      else{\n        const hp=(location.hash||'').replace(/^#/,'');\n        renderPage(document.getElementById(hp)?hp:'home');\n      }\n    });"
          new="    window.addEventListener('popstate',function(e){\n      const st=e.state;\n      let target='home';\n      if(st&&st.__indoSite&&st.page)target=st.page;\n      else{\n        const hp=(location.hash||'').replace(/^#/,'');\n        target=document.getElementById(hp)?hp:'home';\n      }\n      renderPage(target);\n      refreshHistoryPage(target);\n    });"
          if old not in s: raise SystemExit('popstate target not found')
          s=s.replace(old,new)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'data/unfamiliar-daily-review\.js\?v=[^\"<]+','data/unfamiliar-daily-review.js?v=20260915-audit1',s)
          s=re.sub(r'data/home-modules-layout\.js\?v=[^\"<]+','data/home-modules-layout.js?v=20260915-audit1',s)
          s=re.sub(r'data/vocab-memory-feedback\.js\?v=[^\"<]+','data/vocab-memory-feedback.js?v=20260915-audit1',s)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/home-modules-layout.js index.html
          git diff --cached --quiet || git commit -m 'Finish weakness runtime audit hardening'
          git pull --rebase origin main
          git push origin HEAD:main
