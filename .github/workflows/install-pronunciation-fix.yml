name: Install pronunciation fix
on:
  push:
    paths:
      - '.github/workflows/install-pronunciation-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pronunciation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="data/pronunciation.js?v=4"></script>'
          import re
          s=re.sub(r'<script src="data/pronunciation\.js\?v=\d+"></script>','',s)
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load robust Indonesian pronunciation" || exit 0
          git push
