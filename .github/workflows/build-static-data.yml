name: Load uploaded vocabulary

on:
  push:
    paths:
      - 'data/vocab-data.js'
      - '.github/workflows/build-static-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point vocabulary page to static data
        run: |
          python - <<'PY'
          import re, pathlib
          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any older vocab static tag, then insert the current static word list.
          s = re.sub(r'<script src="data/vocab-data\.js(?:\?[^\"]*)?"></script>', '', s)
          marker = '<script>\nconst BASE='
          tag = '<script src="data/vocab-data.js?v=715"></script>\n'
          if marker not in s:
              raise SystemExit('main script marker not found')
          s = s.replace(marker, tag + marker, 1)

          new_load_db = r'''function loadDB(){
            try{
              DB = Array.isArray(window.EMBEDDED_DB) ? window.EMBEDDED_DB : [];
              if(!DB.length) throw new Error('715词词库脚本未加载');
              FILTER=DB.slice();
              $('vocabCount').textContent=DB.length;
              $('vocabTag').textContent=DB.length+' 个词条';
              $('dbStatus').textContent=DB.length+' 个词条';
              const cats=[...new Set(DB.flatMap(x=>x.categories||[]))].sort();
              $('cat').innerHTML='<option value="">全部分类</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');
              idx=0; renderVocab(); updateStats();
            }catch(e){
              $('vocabCount').textContent='失败';
              $('dbStatus').textContent='加载失败';
              $('vocabBox').innerHTML='<div class="error"><b>词库加载失败</b><div>'+esc(e.message)+'</div></div>';
            }
          }
          window.loadDB=loadDB;'''

          patterns = [
              r'async function loadDB\(\)\{.*?\}\nwindow\.loadDB=loadDB;',
              r'function loadDB\(\)\{.*?\}\nwindow\.loadDB=loadDB;'
          ]
          replaced = False
          for pat in patterns:
              ns, n = re.subn(pat, new_load_db, s, count=1, flags=re.S)
              if n == 1:
                  s = ns
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('loadDB block not found')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit vocabulary page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load uploaded 715-word vocabulary"
          git push
