name: Append 2026-09-08 daily vocab
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-2026-09-08-daily-vocab.yml'
jobs:
  append:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Append lesson vocab safely
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          lesson=json.loads(Path('data/daily/2026-09-08-am.json').read_text())
          p=Path('data/daily-vocab-data.js')
          s=p.read_text()
          m=re.fullmatch(r'\s*window\.DAILY_VOCAB_DB\s*=\s*(\[.*\]);\s*',s,re.S)
          if not m: raise SystemExit('Unexpected DAILY_VOCAB_DB format')
          db=json.loads(m.group(1))
          seen={str(x.get('word','')).strip().lower() for x in db}
          for v in lesson['vocab']:
              k=v['word'].strip().lower()
              if k in seen: continue
              db.append({
                'word':v['word'],'cn':v['cn'],'en':v['en'],'root':v['root'],'root_cn':v['root_cn'],
                'example':v['example'],'example_cn':v['example_cn'],
                'categories':['每日学习','08:00'],
                'times_seen':1,'first_seen':'2026-09-08 08:00','last_seen':'2026-09-08 08:00',
                'sessions':['08:00'],'dates':['2026-09-08']
              })
              seen.add(k)
          p.write_text('window.DAILY_VOCAB_DB = '+json.dumps(db,ensure_ascii=False,indent=2)+';\n')
          PY
      - name: Commit database
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/daily-vocab-data.js
          git diff --cached --quiet || git commit -m 'Update daily vocab for 2026-09-08 [skip ci]'
          git push
