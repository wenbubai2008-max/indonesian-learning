name: Install compact home modules layout
on:
  push:
    branches: [main]
    paths:
      - 'data/home-modules-layout.js'
      - '.github/workflows/install-home-modules-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="data/home-modules-layout.js?v=20260904-1"></script>'
          if 'data/home-modules-layout.js' not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Install compact home module layout"
            git push
          fi
