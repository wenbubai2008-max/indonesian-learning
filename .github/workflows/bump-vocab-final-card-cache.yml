name: Bump final BIPA card cache
on:
  push:
    paths:
      - '.github/workflows/bump-vocab-final-card-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump vocabulary loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data/vocab-memory-feedback.js?v=20260917-finalcard1'
          new='data/vocab-memory-feedback.js?v=20260917-finalcard2'
          if old not in s and new not in s:
              raise SystemExit('vocab-memory-feedback script tag not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify final BIPA loader
        run: |
          grep -q 'data/vocab-memory-feedback.js?v=20260917-finalcard2' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump compact BIPA toolbar cache'
          git push
