name: Build learning runtime

on:
  push:
    branches: [main]
    paths:
      - 'data/weakness-sync.json'
      - 'data/daily-vocab-data.js'
      - 'data/master-vocab-data.js'
      - 'data/master-vocab-data-2.js'
      - 'data/master-vocab-data-3.js'
      - 'data/oral-vocab-candidates.js'
      - 'data/learning-pool-rules.json'
      - '.github/workflows/build-learning-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-learning-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build compact runtime pools
        shell: bash
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const rules=JSON.parse(fs.readFileSync('data/learning-pool-rules.json','utf8'));
          if(Number(rules.master_total)!==977) throw new Error('learning-pool-rules master_total must be 977');
          if(rules.new_pool_formula!=='M ∩ A − D'||rules.review_pool_formula!=='A ∩ D') throw new Error('Unexpected learning-pool formula');

          const ctx={window:{}};vm.createContext(ctx);
          for(const p of ['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js','data/oral-vocab-candidates.js','data/daily-vocab-data.js'])vm.runInContext(fs.readFileSync(p,'utf8'),ctx,{filename:p});
          const key=s=>String(s||'').trim().toLowerCase();
          const masterRaw=Array.isArray(ctx.window.MASTER_VOCAB_DB)?ctx.window.MASTER_VOCAB_DB:[];
          const dailyRaw=Array.isArray(ctx.window.DAILY_VOCAB_DB)?ctx.window.DAILY_VOCAB_DB:[];
          const oralRaw=Array.isArray(ctx.window.ORAL_VOCAB_CANDIDATES)?ctx.window.ORAL_VOCAB_CANDIDATES:[];
          const weakDoc=JSON.parse(fs.readFileSync('data/weakness-sync.json','utf8'));
          const weakWords=weakDoc&&weakDoc.words&&typeof weakDoc.words==='object'?Object.values(weakDoc.words):(Array.isArray(weakDoc)?weakDoc:Object.values(weakDoc||{}).filter(x=>x&&typeof x==='object'&&x.word));

          const master=[],seen=new Set();
          for(const item of masterRaw){const w=Array.isArray(item)?item[0]:(item&&item.word),k=key(w);if(!k||seen.has(k))continue;seen.add(k);master.push(String(w).trim())}
          if(master.length!==977) throw new Error(`Master vocabulary count mismatch: ${master.length}`);

          const dailySet=new Set(dailyRaw.map(x=>key(x&&x.word)).filter(Boolean));
          const weakMap=new Map();for(const x of weakWords){const k=key(x&&x.word);if(k)weakMap.set(k,x)}
          const activeMap=new Map([...weakMap].filter(([,x])=>x&&x.status==='active'));
          const masteredCount=[...weakMap.values()].filter(x=>x&&x.status==='mastered').length;

          const newFull=master.filter(w=>activeMap.has(key(w))&&!dailySet.has(key(w)));
          const newFullSet=new Set(newFull.map(key));
          const oralFull=oralRaw
            .filter(x=>newFullSet.has(key(x&&x.word)))
            .map(x=>[String(x.word||'').trim(),x.register||'',x.oral||'',x.root||'',Number.isFinite(Number(x.rank))?Number(x.rank):999999])
            .sort((a,b)=>((a[1]==='口语'?0:1)-(b[1]==='口语'?0:1))||(a[4]-b[4])||a[0].localeCompare(b[0]));
          const oralExposed=oralFull.slice(0,40);

          const newExposed=[];const newSeen=new Set();
          for(const w of [...newFull.slice(0,140),...oralExposed.map(x=>x[0])]){const k=key(w);if(!k||newSeen.has(k))continue;newSeen.add(k);newExposed.push(w)}

          const reviewFull=[];
          for(const x of activeMap.values()){
            if(!dailySet.has(key(x.word)))continue;
            const reasons=Array.isArray(x.reasons)?x.reasons:[];
            let p=4;if(reasons.includes('quick_wrong')||x.last_wrong)p=1;else if(reasons.includes('memory_dont'))p=2;else if(reasons.includes('memory_fuzzy'))p=3;
            reviewFull.push([String(x.word||'').trim(),p,Number(x.wrong_count||0),x.last_wrong||'',x.last_review||'',x.updated_at||x.last_seen||'']);
          }
          reviewFull.sort((a,b)=>a[1]-b[1]||String(b[5]||'').localeCompare(String(a[5]||'')));
          const reviewExposed=reviewFull.slice(0,60).map(x=>x.slice(0,5));

          const runtime={
            version:4,
            rules_version:Number(rules.version||0),
            generated_at:new Date().toISOString(),
            weakness_updated_at:weakDoc&&weakDoc.updated_at?weakDoc.updated_at:'',
            stats:{master_unique:master.length,weak_active_total:activeMap.size,weak_mastered_total:masteredCount,daily_taught_unique:dailySet.size,new_pool_total_full:newFull.length,new_pool_exposed:newExposed.length,review_pool_total_full:reviewFull.length,review_pool_exposed:reviewExposed.length,oral_new_pool_total_full:oralFull.length,oral_new_pool_exposed:oralExposed.length},
            schema:{oral:['word','register','counterpart','root','rank'],review:['word','priority','wrong_count','last_wrong','last_review']},
            new_pool:newExposed,
            oral_new_pool:oralExposed,
            review_pool:reviewExposed
          };
          fs.writeFileSync('data/learning-runtime.json',JSON.stringify(runtime)+'\n');
          console.log(runtime.stats);
          NODE
      - name: Commit runtime if changed
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning-runtime.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build learning runtime pools'
          git pull --rebase origin main
          git push origin HEAD:main
