name: Build learning runtime

on:
  push:
    branches: [main]
    paths:
      - 'data/weakness-sync.json'
      - 'data/daily-vocab-data.js'
      - 'data/master-vocab-data.js'
      - 'data/master-vocab-data-2.js'
      - 'data/master-vocab-data-3.js'
      - 'data/oral-vocab-candidates.js'
      - 'data/learning-pool-rules.json'
      - 'data/bipa-gz-*.js'
      - 'data/bipa-secondary-seed-20260917.js'
      - '.github/scripts/build-bipa-runtime.js'
      - '.github/scripts/build-learning-runtime.js'
      - '.github/scripts/regression-guard.js'
      - '.github/scripts/vocab-ui-regression-guard.js'
      - '.github/workflows/build-learning-runtime.yml'
      - '.github/workflows/sync-daily-vocab.yml'
      - 'index.html'
      - 'data/daily-width-fix.css'
      - 'data/home-modules-layout.js'
      - 'data/home-modules-stability.js'
      - 'data/history-v2.js'
      - 'data/daily-light-test.js'
      - 'data/daily-ui-polish.js'
      - 'data/vocab-dom-compat.js'
      - 'data/vocab-memory-feedback.js'
      - 'data/vocab-controller-20260917.js'
      - 'data/vocab-unified-renderer-20260917.js'
      - 'data/vocab-unified-ui-guard-20260917.js'
      - 'AGENTS.md'
      - 'docs/REGRESSION-GUARD.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-learning-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build runtime data and run regression guards
        shell: bash
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          node .github/scripts/build-bipa-runtime.js
          node .github/scripts/build-learning-runtime.js
          node .github/scripts/regression-guard.js
          node .github/scripts/vocab-ui-regression-guard.js
      - name: Commit runtime if changed
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bipa-runtime-data.js data/learning-runtime.json data/master-vocab-secondary.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build learning runtime pools'
          git pull --rebase origin main
          git push origin HEAD:main
