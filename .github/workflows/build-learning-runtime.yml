name: Build learning runtime

on:
  push:
    branches: [main]
    paths:
      - 'data/weakness-sync.json'
      - 'data/master-vocab-data.js'
      - 'data/master-vocab-data-2.js'
      - 'data/master-vocab-data-3.js'
      - 'data/master-handoff-state.json'
      - 'data/oral-vocab-candidates.js'
      - 'data/learning-pool-rules.json'
      - 'data/bipa-gz-*.js'
      - 'data/bipa-level-*-gz.js'
      - 'data/bipa-level-manifest.json'
      - 'data/bipa-json-loader-20260917.js'
      - 'data/bipa-secondary-seed-20260917.js'
      - '.github/scripts/build-bipa-level-chunks.js'
      - '.github/scripts/build-learning-runtime.js'
      - '.github/scripts/build-vocab-profile.js'
      - '.github/scripts/write-vocab-profile-snapshot.js'
      - '.github/scripts/test-vocab-profile-snapshot.js'
      - '.github/scripts/inject-vocab-profile.js'
      - '.github/scripts/regression-guard.js'
      - '.github/scripts/vocab-ui-regression-guard.js'
      - '.github/workflows/build-learning-runtime.yml'
      - 'index.html'
      - 'data/daily-width-fix.css'
      - 'data/home-modules-layout.js'
      - 'data/home-modules-stability.js'
      - 'data/home-learning-upgrade-v2.js'
      - 'data/automation-training.js'
      - 'data/vocab-profile-ui.js'
      - 'data/history-v2.js'
      - 'data/daily-light-test.js'
      - 'data/daily-ui-polish.js'
      - 'data/vocab-dom-compat.js'
      - 'data/vocab-memory-feedback.js'
      - 'data/vocab-controller-20260917.js'
      - 'data/vocab-unified-renderer-20260917.js'
      - 'data/vocab-unified-ui-guard-20260917.js'
      - 'AGENTS.md'
      - 'docs/REGRESSION-GUARD.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Serialize every workflow that writes runtime/profile/audit to avoid main-branch races.
  group: learning-data-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Recompute runtime from latest main and commit safely
        shell: bash
        run: |
          set -Eeuo pipefail
          incident_phase='startup'
          incident_category='unknown'
          record_incident_on_exit() {
            rc=$?
            if [ "$rc" -eq 0 ]; then return 0; fi
            report="$RUNNER_TEMP/learning-incident.txt"
            {
              printf 'Workflow: %s\n' "$GITHUB_WORKFLOW"
              printf 'Category (preliminary): %s\n' "$incident_category"
              printf 'Phase: %s\n' "$incident_phase"
              printf 'Exit code: %s\n' "$rc"
              printf 'UTC time: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              printf 'Run: https://github.com/%s/actions/runs/%s/attempts/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
              printf 'Trigger SHA: %s\n' "$GITHUB_SHA"
              printf 'Local HEAD: %s\n' "$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
              printf 'Fetched origin/main: %s\n' "$(git rev-parse origin/main 2>/dev/null || echo unavailable)"
              printf 'Full error details: see the failing step in the linked GitHub run.\n'
            } > "$report"
            { echo '### Learning workflow failure'; cat "$report"; } >> "$GITHUB_STEP_SUMMARY" || true
          }
          trap record_incident_on_exit EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never rebase generated files. If main moves, discard derived output and
          # recompute from the new HEAD, just like Sync daily vocab.
          for attempt in 1 2; do
            incident_phase="fetch_main"; incident_category="git_transport"
            echo "Build attempt ${attempt}/2: recompute from latest origin/main"
            git fetch origin main
            git reset --hard origin/main
          incident_phase='recompute_runtime'; incident_category='derived_data'
          python - <<'PY'
          import hashlib,pathlib,re
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          scripts=[
              'data/history-v2.js',
              'data/daily-light-test.js',
              'data/daily-ui-polish.js',
              'data/vocab-memory-feedback.js',
          ]
          for script in scripts:
              h=hashlib.sha256(pathlib.Path(script).read_bytes()).hexdigest()[:12]
              s=re.sub(re.escape(script)+r'\?v=[^"\']+',script+'?v='+h,s)
          p.write_text(s,encoding='utf-8')
          PY
          node .github/scripts/inject-vocab-profile.js
          node .github/scripts/build-bipa-level-chunks.js
          node --check data/vocab-memory-feedback.js
          node --check data/vocab-controller-20260917.js
          node --check data/home-learning-upgrade-v2.js
          node --check data/automation-training.js
          node --check data/home-modules-layout.js
          node --check data/vocab-profile-ui.js
          node --check .github/scripts/build-vocab-profile.js
          node --check .github/scripts/write-vocab-profile-snapshot.js
          node --check .github/scripts/test-vocab-profile-snapshot.js
          node .github/scripts/test-vocab-profile-snapshot.js
          node --check .github/scripts/inject-vocab-profile.js
          node --check data/bipa-json-loader-20260917.js
          node --check data/bipa-level-a1-gz.js
          node --check data/bipa-level-a2-gz.js
          node --check data/bipa-level-b1-gz.js
          node --check data/bipa-level-b2-gz.js
          node .github/scripts/build-learning-runtime.js
          node .github/scripts/build-vocab-profile.js
          node .github/scripts/write-vocab-profile-snapshot.js
          incident_phase='regression_guard'; incident_category='validation'
          node .github/scripts/regression-guard.js
          node .github/scripts/vocab-ui-regression-guard.js
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo '::warning title=Build input changed::main advanced during computation; discard output and retry.'
              continue
            fi
            incident_phase='prepare_commit'; incident_category='git_write'
            git add index.html data/learning-runtime.json data/vocab-profile.json data/vocab-profile-history.json data/master-vocab-secondary.js data/master-handoff-state.json data/learning-pool-audit.json data/bipa-level-a1-gz.js data/bipa-level-a2-gz.js data/bipa-level-b1-gz.js data/bipa-level-b2-gz.js data/bipa-level-manifest.json
            if git diff --cached --quiet; then
              echo 'Build already current; no empty commit.'
              exit 0
            fi
            git commit -m 'Build learning runtime pools'
            incident_phase='publish_commit'; incident_category='git_push_or_concurrency'
            if git push origin HEAD:main; then
              echo "Build push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "::warning title=Build branch advanced or push failed::Attempt ${attempt} did not publish; discard derived commit and recompute from current main."
          done
          echo '::error title=Build push failed::Two safe attempts failed; no force push, no stale rebase. Inspect original git push errors.'
          exit 1
      - name: Record failure as a durable GitHub issue
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/learning-incident.txt"
          if [ ! -s "$report" ]; then
            {
              echo "Workflow: $GITHUB_WORKFLOW"
              echo 'Category (preliminary): setup_or_runner'
              echo 'Phase: before_capture'
              echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
              echo 'Full error details: see the failing step in the linked GitHub run.'
            } > "$report"
          fi
          category=$(sed -n 's/^Category (preliminary): //p' "$report" | head -n 1)
          phase=$(sed -n 's/^Phase: //p' "$report" | head -n 1)
          title="[Learning incident] $GITHUB_WORKFLOW: $category/$phase"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue reopen "$existing" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
          fi
      - name: Preserve original failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learning-incident-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/learning-incident.txt
          if-no-files-found: warn
          retention-days: 90
