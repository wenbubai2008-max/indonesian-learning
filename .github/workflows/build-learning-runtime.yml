name: Build learning runtime

on:
  push:
    branches: [main]
    paths:
      - 'data/weakness-sync.json'
      - 'data/daily-vocab-data.js'
      - 'data/master-vocab-data.js'
      - 'data/master-vocab-data-2.js'
      - 'data/master-vocab-data-3.js'
      - 'data/oral-vocab-candidates.js'
      - 'data/learning-pool-rules.json'
      - '.github/scripts/build-learning-runtime.js'
      - '.github/workflows/build-learning-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-learning-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build compact runtime pools
        shell: bash
        run: |
          set -e
          git fetch origin main
          git reset --hard origin/main
          node .github/scripts/build-learning-runtime.js
      - name: Commit runtime if changed
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning-runtime.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build learning runtime pools'
          git pull --rebase origin main
          git push origin HEAD:main
