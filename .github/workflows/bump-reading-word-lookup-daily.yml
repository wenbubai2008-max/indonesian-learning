name: Bump daily reading word lookup cache
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-reading-word-lookup-daily.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data/reading-word-lookup.js?v=20260901-1','data/reading-word-lookup.js?v=20260901-2')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Bump daily reading word lookup cache"
          git push
