name: Refresh reading and weakness runtime caches
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-reading-word-lookup-daily.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update script versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'data/reading-word-lookup\.js\?v=[^"<]+','data/reading-word-lookup.js?v=20260915-bgqueue1',s)
          s=re.sub(r'data/weakness-pool\.js\?v=[^"<]+','data/weakness-pool.js?v=20260915-runtime2',s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh reading and weakness runtime caches"
          git push
