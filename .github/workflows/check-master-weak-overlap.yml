name: Check master weak overlap

on:
  push:
    paths:
      - '.github/workflows/check-master-weak-overlap.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute overlap
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const files=['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'];
          const ctx={window:{MASTER_VOCAB_DB:[]}};
          files.forEach(f=>vm.runInNewContext(fs.readFileSync(f,'utf8'),ctx,{filename:f}));
          const norm=w=>String(w||'').trim().toLowerCase();
          const master=[...new Map((ctx.window.MASTER_VOCAB_DB||[]).map(x=>[norm(Array.isArray(x)?x[0]:x.word),Array.isArray(x)?x[0]:x.word])).entries()].filter(([k])=>k);
          const masterSet=new Set(master.map(([k])=>k));
          const weak=JSON.parse(fs.readFileSync('data/weakness-sync.json','utf8'));
          const active=[],mastered=[];
          for(const [k,v] of Object.entries(weak.words||{})){
            const n=norm(v?.word||k); if(!n)continue;
            if(v?.status==='active')active.push(n);
            else if(v?.status==='mastered')mastered.push(n);
          }
          const activeSet=new Set(active), masteredSet=new Set(mastered);
          const activeOverlap=[...masterSet].filter(w=>activeSet.has(w)).sort();
          const masteredOverlap=[...masterSet].filter(w=>masteredSet.has(w)).sort();
          const anyWeakOverlap=[...new Set([...activeOverlap,...masteredOverlap])].sort();
          const result={
            master_unique:masterSet.size,
            weakness_total:Object.keys(weak.words||{}).length,
            weakness_active_unique:activeSet.size,
            weakness_mastered_unique:masteredSet.size,
            master_x_active_count:activeOverlap.length,
            master_x_mastered_count:masteredOverlap.length,
            master_x_anyweak_count:anyWeakOverlap.length,
            active_overlap_words:activeOverlap,
            mastered_overlap_words:masteredOverlap
          };
          console.log('OVERLAP_RESULT='+JSON.stringify(result));
          NODE
