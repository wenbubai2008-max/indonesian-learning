name: Check master weak overlap

on:
  push:
    paths:
      - '.github/workflows/check-master-weak-overlap.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute overlap
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const norm=w=>String(w||'').trim().toLowerCase();

          const mctx={window:{MASTER_VOCAB_DB:[]}};
          ['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'].forEach(f=>vm.runInNewContext(fs.readFileSync(f,'utf8'),mctx,{filename:f}));
          const masterSet=new Set((mctx.window.MASTER_VOCAB_DB||[]).map(x=>norm(Array.isArray(x)?x[0]:x.word)).filter(Boolean));

          const dctx={window:{DAILY_VOCAB_DB:[]}};
          vm.runInNewContext(fs.readFileSync('data/daily-vocab-data.js','utf8'),dctx,{filename:'data/daily-vocab-data.js'});
          const dailySet=new Set((dctx.window.DAILY_VOCAB_DB||[]).map(x=>norm(Array.isArray(x)?x[0]:x.word)).filter(Boolean));

          const weak=JSON.parse(fs.readFileSync('data/weakness-sync.json','utf8'));
          const activeSet=new Set(),masteredSet=new Set();
          for(const [k,v] of Object.entries(weak.words||{})){
            const n=norm(v?.word||k); if(!n)continue;
            if(v?.status==='active')activeSet.add(n);
            else if(v?.status==='mastered')masteredSet.add(n);
          }

          const ix=(a,b)=>[...a].filter(x=>b.has(x));
          const masterActive=ix(masterSet,activeSet);
          const masterMastered=ix(masterSet,masteredSet);
          const masterDaily=ix(masterSet,dailySet);
          const masterActiveDaily=masterActive.filter(x=>dailySet.has(x));
          const masterActiveNotDaily=masterActive.filter(x=>!dailySet.has(x));
          const masterMasteredDaily=masterMastered.filter(x=>dailySet.has(x));
          const masterMasteredNotDaily=masterMastered.filter(x=>!dailySet.has(x));
          const masterNotDaily=[...masterSet].filter(x=>!dailySet.has(x));
          const masterUnclassified=[...masterSet].filter(x=>!activeSet.has(x)&&!masteredSet.has(x));

          const result={
            master_unique:masterSet.size,
            daily_unique:dailySet.size,
            weakness_active_unique:activeSet.size,
            weakness_mastered_unique:masteredSet.size,
            master_x_active:masterActive.length,
            master_x_mastered:masterMastered.length,
            master_x_weak_any:new Set([...masterActive,...masterMastered]).size,
            master_x_daily:masterDaily.length,
            master_not_daily:masterNotDaily.length,
            master_active_and_daily:masterActiveDaily.length,
            master_active_not_daily:masterActiveNotDaily.length,
            master_mastered_and_daily:masterMasteredDaily.length,
            master_mastered_not_daily:masterMasteredNotDaily.length,
            master_unclassified_by_weakness:masterUnclassified.length,
            sample_master_active_not_daily:masterActiveNotDaily.slice(0,40),
            sample_master_active_and_daily:masterActiveDaily.slice(0,40)
          };
          console.log('OVERLAP_RESULT='+JSON.stringify(result));
          NODE
