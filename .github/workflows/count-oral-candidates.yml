name: Count current oral vocabulary candidates

on:
  push:
    paths:
      - '.github/workflows/count-oral-candidates.yml'

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count oral fields
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const c={window:{}};
          vm.runInNewContext(fs.readFileSync('data/vocab-data.js','utf8'),c,{filename:'data/vocab-data.js'});
          const db=c.window.EMBEDDED_DB||[];
          const norm=w=>String(w||'').trim().toLowerCase();
          const uniq=arr=>new Set(arr.map(x=>norm(x.word)).filter(Boolean));
          const register=db.filter(x=>String(x.register||'').trim()==='口语');
          const oral=db.filter(x=>String(x.oral||'').trim()!=='');
          const unionMap=new Map();
          [...register,...oral].forEach(x=>{const k=norm(x.word);if(k&&!unionMap.has(k))unionMap.set(k,x);});
          const both=db.filter(x=>String(x.register||'').trim()==='口语'&&String(x.oral||'').trim()!=='');
          console.log('RESULT='+JSON.stringify({total_rows:db.length,total_unique:uniq(db).size,register_oral_rows:register.length,register_oral_unique:uniq(register).size,oral_field_rows:oral.length,oral_field_unique:uniq(oral).size,both_rows:both.length,both_unique:uniq(both).size,oral_candidate_union_unique:unionMap.size,sample:[...unionMap.values()].slice(0,30).map(x=>({word:x.word,oral:x.oral||'',register:x.register||''}))}));
          NODE
