name: Append 2026-09-01 AM vocab
on:
  push:
    paths:
      - '.github/workflows/append-2026-09-01-am-vocab.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append daily vocabulary safely
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          lesson=json.loads(Path('data/daily/2026-09-01-am.json').read_text(encoding='utf-8'))
          p=Path('data/daily-vocab-data.js')
          s=p.read_text(encoding='utf-8')
          m=re.match(r'\s*window\.DAILY_VOCAB_DB\s*=\s*(\[.*\])\s*;\s*$',s,re.S)
          if not m:
              raise SystemExit('Unexpected DAILY_VOCAB_DB format')
          db=json.loads(m.group(1))
          seen={str(x.get('word','')).strip().lower() for x in db}
          for v in lesson['vocab']:
              key=v['word'].strip().lower()
              if key in seen:
                  continue
              db.append({
                  'word':v['word'],
                  'cn':v.get('cn',''),
                  'en':v.get('en',''),
                  'root':v.get('root',''),
                  'categories':['每日学习','08:00'],
                  'times_seen':1,
                  'first_seen':'2026-09-01 08:00',
                  'last_seen':'2026-09-01 08:00',
                  'sessions':['08:00'],
                  'dates':['2026-09-01']
              })
              seen.add(key)
          p.write_text('window.DAILY_VOCAB_DB = '+json.dumps(db,ensure_ascii=False,indent=2)+';\n',encoding='utf-8')
          PY
      - name: Commit synced vocab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-vocab-data.js
          git commit -m "Append 2026-09-01 AM daily vocabulary" || exit 0
          git push
