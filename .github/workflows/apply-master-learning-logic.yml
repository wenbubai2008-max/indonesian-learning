name: Apply master learning state logic

on:
  push:
    paths:
      - '.github/workflows/apply-master-learning-logic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update UI terminology and master loading
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replace(path, pairs){
            let s=fs.readFileSync(path,'utf8');
            for(const [a,b] of pairs){
              if(!s.includes(a)) console.log('WARN missing',path,a);
              s=s.split(a).join(b);
            }
            fs.writeFileSync(path,s,'utf8');
          }

          replace('index.html',[
            ['title="查看待复习词汇"><span>待复习</span>','title="查看待掌握词汇"><span>待掌握</span>']
          ]);

          replace('data/library-switcher.js',[
            ['if(masterObjects().length>=800)return;','if(masterObjects().length>=977)return;'],
            ["+' · '+unchecked+' 未判断 · '+review+' 不会 · '+known+' 已掌握 · '+arr.length+' 总词'","+' · '+unchecked+' 未判断 · '+review+' 待掌握 · '+known+' 已掌握 · '+arr.length+' 总词'"],
            ["+' · 不会 '+FILTER.length+' 词（查看中）'","+' · 待掌握 '+FILTER.length+' 词（查看中）'"],
            ['查看当前词库待复习词汇','查看当前词库待掌握词汇'],
            ['查看当前词库不会/模糊词汇','查看当前词库待掌握词汇']
          ]);

          replace('data/vocab-scoped-stats.js',[
            ["+' 待复习 · '+c.known+' 已掌握 · '+c.total+' 总词'","+' 待掌握 · '+c.known+' 已掌握 · '+c.total+' 总词'"]
          ]);

          const rules={
            version:1,
            master_total:977,
            semantics:{
              mastered:'已掌握：用户明确会了；不得作为新词或重点复习词。',
              active:'待掌握：当前模糊/不会/陌生/答错；是否属于新词或复习词还要看 daily-vocab。',
              daily_vocab:'已正式教过：只表示进过每日课程，不等于已经掌握。'
            },
            selection:{
              new_word:'master ∩ active ∩ NOT daily-vocab',
              review_word:'active ∩ daily-vocab',
              excluded:'mastered',
              note:'同一词不得同时进入新词和复习词。模糊/不会但从未正式教过的主词库词，按新词学习；已经正式教过仍 active 的词，按复习处理。'
            }
          };
          fs.writeFileSync('data/learning-state-rules.json',JSON.stringify(rules,null,2)+'\n');

          const idx=fs.readFileSync('index.html','utf8');
          const sw=fs.readFileSync('data/library-switcher.js','utf8');
          if(!idx.includes('<span>待掌握</span>')) throw new Error('index 待掌握标签未生效');
          if(!sw.includes('if(masterObjects().length>=977)return;')) throw new Error('master 977 加载保护未生效');
          if(!sw.includes("review+' 待掌握")) throw new Error('library-switcher 待掌握统计未生效');
          NODE
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/library-switcher.js data/vocab-scoped-stats.js data/learning-state-rules.json
          git rm .github/workflows/apply-master-learning-logic.yml
          git commit -m "Use mastered vs pending learning state logic"
          git push origin HEAD:main
