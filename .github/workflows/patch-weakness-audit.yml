name: Patch weakness audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-weakness-audit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch weakness runtime
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Weakness page: remove self-triggering DOM observer, avoid needless root DOM rewrites,
          #    shrink empty trailing pages, and restore only weakness-origin words.
          p=Path('data/weakness-paging-roots.js')
          s=p.read_text()
          old="""    line.innerHTML='<span>词根：</span><b>'+esc(item.root)+'</b>'+(item.root_cn?'<em> · '+esc(item.root_cn)+'</em>':'');"""
          new="""    const html='<span>词根：</span><b>'+esc(item.root)+'</b>'+(item.root_cn?'<em> · '+esc(item.root_cn)+'</em>':'');\n    if(line.innerHTML!==html)line.innerHTML=html;"""
          if old in s:
              s=s.replace(old,new)

          observer="""    const body=document.getElementById('weaknessBody');\n    if(body&&!body.__weakRootObserver){body.__weakRootObserver=true;new MutationObserver(function(){scheduleDecorate();}).observe(body,{childList:true,subtree:true});}\n"""
          s=s.replace(observer,'')

          old_restore="function restoreAll(){const wp=pool();if(!wp)return;wp.restoreDismissed();makeSession();render();}"
          new_restore="function restoreAll(){const wp=pool();if(!wp)return;wp.restoreDismissed(['quick_wrong','manual_unknown']);makeSession();render();}"
          s=s.replace(old_restore,new_restore)

          marker="  function remainingTotal(active){let n=0;sessionWords.forEach(function(w){if(active[w])n++;});return n;}\n"
          if 'function activePageCount(' not in s and marker in s:
              s=s.replace(marker,marker+"  function activePageCount(active){let last=-1;sessionWords.forEach(function(w,i){if(active[w])last=i;});return Math.max(1,last<0?1:Math.floor(last/PAGE_SIZE)+1);}\n")

          s=s.replace("const active=activeMapSnapshot(),total=remainingTotal(active),totalPages=Math.max(1,Math.ceil(sessionWords.length/PAGE_SIZE));","const active=activeMapSnapshot(),total=remainingTotal(active),totalPages=activePageCount(active);")
          s=s.replace("window.weaknessPageMove=function(delta){const totalPages=Math.max(1,Math.ceil(sessionWords.length/PAGE_SIZE));currentPage=Math.max(0,Math.min(totalPages-1,currentPage+Number(delta||0)));render();window.scrollTo({top:0,behavior:'smooth'});};","window.weaknessPageMove=function(delta){const active=activeMapSnapshot(),totalPages=activePageCount(active);currentPage=Math.max(0,Math.min(totalPages-1,currentPage+Number(delta||0)));render();window.scrollTo({top:0,behavior:'smooth'});};")

          empty_grid="+navHtml(totalPages)+'<div class=\"v2-weak\">'+visible.map(cardHtml).join('')+'</div>'+navHtml(totalPages);"
          new_grid="+navHtml(totalPages)+'<div class=\"v2-weak\">'+(visible.length?visible.map(cardHtml).join(''):'<div class=\"empty\">本页已完成，请点击“下一页”继续。</div>')+'</div>'+navHtml(totalPages);"
          s=s.replace(empty_grid,new_grid)
          p.write_text(s)

          # 2) Weakness pool: filtered, batched restore instead of reactivating every dismissed word one by one.
          p=Path('data/weakness-pool.js')
          s=p.read_text()
          old="""  function restoreDismissed(){\n    const d=parse(LEGACY_DISMISSED),keys=Object.keys(d);keys.forEach(function(k){reactivate((d[k]||{}).word||k,'manual_restore');});localStorage.removeItem(LEGACY_DISMISSED);return keys.length;\n  }"""
          new="""  function restoreDismissed(onlyReasons){\n    const d=parse(LEGACY_DISMISSED),pool=migrate(),wanted=Array.isArray(onlyReasons)?onlyReasons.filter(Boolean):[];\n    let restored=0,changed=false;\n    Object.keys(d).forEach(function(k0){\n      const item=d[k0]||{},k=norm(item.word||k0),existing=pool[k];if(!k)return;\n      if(wanted.length){const h=existing&&existing.reason_history||[];if(!wanted.some(function(r){return h.includes(r);}))return;}\n      const pair=ensureRecord(pool,item.word||k,existing||{}),x=pair[1];if(!x)return;\n      x.status='active';x.last_seen=nowISO();x.times_seen=(x.times_seen||0)+1;x.mastered_reason='';setReason(x,'manual_restore');\n      delete d[k0];restored++;changed=true;\n    });\n    if(Object.keys(d).length)localStorage.setItem(LEGACY_DISMISSED,JSON.stringify(d));else localStorage.removeItem(LEGACY_DISMISSED);\n    if(changed)save(pool);return restored;\n  }"""
          if old not in s:
              raise SystemExit('restoreDismissed target not found')
          s=s.replace(old,new)
          p.write_text(s)

          # 3) Keep homepage wording aligned with actual weakness rules and bump runtime caches.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('集中练“模糊 / 不会”和近期陌生词。','集中练快速练习错题和阅读中加入的陌生词。')
          s=re.sub(r'data/weakness-pool\.js\?v=[^"<]+','data/weakness-pool.js?v=20260915-runtime4',s)
          s=re.sub(r'data/weakness-paging-roots\.js\?v=[^"<]+','data/weakness-paging-roots.js?v=20260915-roots6',s)
          p.write_text(s)

          # 4) Bump the dynamically loaded lightweight meaning-fix cache.
          p=Path('data/unfamiliar-daily-review.js')
          s=p.read_text().replace('data/weakness-meaning-fix.js?v=20260915-2','data/weakness-meaning-fix.js?v=20260915-3')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weakness-paging-roots.js data/weakness-pool.js data/unfamiliar-daily-review.js index.html
          git diff --cached --quiet || git commit -m 'Fix weakness observer loop and filtered restore'
          git pull --rebase origin main
          git push origin HEAD:main
