name: Correct Sep 2 daily vocabulary
on:
  push:
    paths:
      - '.github/workflows/append-sep02-vocab.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Sep 2 vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('data/daily-vocab-data.js')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'window\.DAILY_VOCAB_DB\s*=\s*(\[.*\])\s*;\s*$',s,re.S)
          if not m: raise SystemExit('daily vocab format not recognized')
          arr=json.loads(m.group(1))
          by={str(x.get('word','')).strip().lower():x for x in arr}
          old=by.get('mendadak')
          if old:
            old['dates']=[d for d in (old.get('dates') or []) if d!='2026-09-02']
            if old.get('dates')==['2026-08-26']:
              old['sessions']=[x for x in (old.get('sessions') or []) if x!='08:00']
              old['categories']=[x for x in (old.get('categories') or []) if x!='08:00' and x!='2026-09-02']
              old['last_seen']='2026-08-26 19:00'
              old['times_seen']=1
          a={"word":"dadakan","cn":"临时的；突然安排的（口语）","en":"impromptu; last-minute","root":"dadak","categories":["每日学习","08:00"],"times_seen":1,"first_seen":"2026-09-02 08:00","last_seen":"2026-09-02 08:00","sessions":["08:00"],"dates":["2026-09-02"]}
          if 'dadakan' in by:
            x=by['dadakan'];x['categories']=list(dict.fromkeys((x.get('categories') or [])+a['categories']));x['sessions']=list(dict.fromkeys((x.get('sessions') or [])+a['sessions']));x['dates']=list(dict.fromkeys((x.get('dates') or [])+a['dates']));x['last_seen']='2026-09-02 08:00';x['times_seen']=max(int(x.get('times_seen',1)),len(x['dates']))
          else: arr.append(a)
          p.write_text('window.DAILY_VOCAB_DB = '+json.dumps(arr,ensure_ascii=False,indent=2)+';\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-vocab-data.js
          git commit -m "Correct Sep 2 daily vocabulary" || exit 0
          git push
