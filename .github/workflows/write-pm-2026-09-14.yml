          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const norm=x=>String(x||'').trim().toLowerCase();
          const lesson=JSON.parse(fs.readFileSync('/tmp/pm.json','utf8'));
          const masterCtx={window:{}};
          for(const p of ['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js']) vm.runInNewContext(fs.readFileSync(p,'utf8'),masterCtx,{filename:p});
          const masterSet=new Set((masterCtx.window.MASTER_VOCAB_DB||[]).map(x=>norm(Array.isArray(x)?x[0]:x.word)));
          const dc={window:{}}; vm.runInNewContext(fs.readFileSync('data/daily-vocab-data.js','utf8'),dc,{filename:'daily-vocab-data.js'}); const daily=dc.window.DAILY_VOCAB_DB||[]; const dailySet=new Set(daily.map(x=>norm(x.word)));
          const oc={window:{}}; vm.runInNewContext(fs.readFileSync('data/oral-vocab-candidates.js','utf8'),oc,{filename:'oral-vocab-candidates.js'}); const oralSet=new Set((oc.window.ORAL_VOCAB_CANDIDATES||[]).map(x=>norm(x.word)));
          const weak=JSON.parse(fs.readFileSync('data/weakness-sync.json','utf8')); const words=weak.words||{};
          const active=k=>words[k]&&words[k].status==='active';
          const newWords=['sesuai','solusi','misalnya','antar'];
          const reviewWords=['ujung-ujungnya','tergantung','masukan','urusan dadakan','tagihan'];
          const appWords=['pihak','anggota','mantap'];
          for(const w of newWords){if(!masterSet.has(w)||!active(w)||dailySet.has(w)) throw new Error('Invalid new word: '+w)}
          if(!oralSet.has('antar')) throw new Error('antar is not in oral candidate pool');
          for(const w of reviewWords){if(!active(w)||!dailySet.has(w)) throw new Error('Invalid review word: '+w)}
          for(const w of appWords){if(!active(w)||!dailySet.has(w)) throw new Error('Invalid application word: '+w)}
          if((lesson.vocab||[]).length!==12) throw new Error('PM vocab must contain 12 core items');
          if((lesson.daily_test?.items||[]).length!==6) throw new Error('daily_test must contain 6 items');
          const types=lesson.daily_test.items.map(x=>x.type).join(',');
          if(types!=='choice,choice,choice,fill,fill,order') throw new Error('daily_test type sequence invalid: '+types);
          fs.writeFileSync('data/daily/2026-09-14-pm.json',JSON.stringify(lesson,null,2)+'\n');
          const add=[
            {word:'sesuai',cn:'符合；适合；与……一致',en:'suitable; appropriate; in accordance with',root:'suai',root_cn:'匹配；合适',example:'Kita cari tempat yang sesuai sama kebutuhan semua anggota.',example_cn:'我们找一个符合所有成员需求的地方。',categories:['每日学习','19:00']},
            {word:'solusi',cn:'解决方案；办法',en:'solution',root:'solusi',root_cn:'解决方案',example:'Kalau jadwalnya bentrok, kita cari solusi yang paling sederhana dulu.',example_cn:'如果时间冲突，我们先找最简单的解决办法。',categories:['每日学习','19:00']},
            {word:'misalnya',cn:'例如；比如说',en:'for example; for instance',root:'misal',root_cn:'例子；假设',example:'Misalnya hujan, kita bisa pindah ke tempat yang di dalam ruangan.',example_cn:'比如下雨的话，我们可以换到室内的地方。',categories:['每日学习','19:00']},
            {word:'antar',cn:'送；送到（口语高频）',en:'take; deliver; drop off',root:'antar',root_cn:'送；递送',example:'Kalau pulangnya kemalaman, nanti aku antar kamu sampai depan.',example_cn:'如果回去太晚，我等会儿送你到门口。',categories:['每日学习','19:00','口语']}
          ];
          for(const x of add){if(dailySet.has(norm(x.word))) throw new Error('Duplicate daily word before append: '+x.word); daily.push({...x,times_seen:1,first_seen:'2026-09-14 19:00',last_seen:'2026-09-14 19:00',sessions:['19:00'],dates:['2026-09-14']}); dailySet.add(norm(x.word));}
          fs.writeFileSync('data/daily-vocab-data.js','window.DAILY_VOCAB_DB = '+JSON.stringify(daily,null,2)+';\n');
          const index=JSON.parse(fs.readFileSync('data/daily/index.json','utf8')); const row=index.dates.find(x=>x.date==='2026-09-14'); if(!row) throw new Error('Missing 2026-09-14 index row'); row.pm=true; row.pm_day=24; row.pm_status='generated_manual_recovery'; row.verified='generated_daily_lesson'; index.updated='2026-09-14'; fs.writeFileSync('data/daily/index.json',JSON.stringify(index,null,2)+'\n');
          console.log('VALIDATED='+JSON.stringify({newWords,reviewWords,appWords,oralNew:'antar',dailyTotal:daily.length,pmVocab:lesson.vocab.length,testItems:lesson.daily_test.items.length}));
          NODE
      - name: Commit lesson
