name: Install daily lesson UI polish
on:
  push:
    paths:
      - '.github/workflows/install-daily-ui-polish.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="data/daily-ui-polish.js?v=20260901-1"></script>'
          import re
          s=re.sub(r'<script src="data/daily-ui-polish\.js\?v=[^"]+"></script>','',s)
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable polished daily lesson layout" || exit 0
          git push
