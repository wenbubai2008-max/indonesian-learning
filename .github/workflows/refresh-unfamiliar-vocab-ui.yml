name: Refresh unfamiliar vocab UI
on:
  push:
    paths:
      - '.github/workflows/refresh-unfamiliar-vocab-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump script versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'data/library-switcher\.js\?v=[^"\']+', 'data/library-switcher.js?v=20260901-2', s)
          s=re.sub(r'data/reading-word-lookup\.js\?v=[^"\']+', 'data/reading-word-lookup.js?v=20260901-3', s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh unfamiliar vocabulary UI scripts"
          git push
