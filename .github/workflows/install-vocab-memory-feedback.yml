name: Install vocab memory feedback
on:
  push:
    paths:
      - '.github/workflows/install-vocab-memory-feedback.yml'
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="data/vocab-memory-feedback.js?v=20260907-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add index.html
          git commit -m 'Install vocabulary memory feedback'
          git push
