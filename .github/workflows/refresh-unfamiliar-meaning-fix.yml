name: Refresh unfamiliar meaning fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-unfamiliar-meaning-fix.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump library switcher cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2=re.sub(r'data/library-switcher\.js\?v=[^"\']+', 'data/library-switcher.js?v=20260902-meaning2', s)
          if s2==s:
              s2=s.replace('data/library-switcher.js', 'data/library-switcher.js?v=20260902-meaning2', 1)
          p.write_text(s2)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh unfamiliar vocabulary meanings'
          git push
