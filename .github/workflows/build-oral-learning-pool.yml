name: Build oral vocabulary learning pool and audit

on:
  push:
    paths:
      - '.github/workflows/build-oral-learning-pool.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build oral pool and verify learning logic
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const norm=w=>String(w||'').trim().toLowerCase();
          function runFile(path,seed={}){const c={window:seed};vm.runInNewContext(fs.readFileSync(path,'utf8'),c,{filename:path});return c.window;}

          const vocab=runFile('data/vocab-data.js',{}).EMBEDDED_DB||[];
          const masterSeed={MASTER_VOCAB_DB:[]};
          ['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'].forEach(f=>vm.runInNewContext(fs.readFileSync(f,'utf8'),{window:masterSeed},{filename:f}));
          const master=masterSeed.MASTER_VOCAB_DB||[];
          const daily=runFile('data/daily-vocab-data.js',{}).DAILY_VOCAB_DB||[];
          const weak=JSON.parse(fs.readFileSync('data/weakness-sync.json','utf8'));

          function wordOf(x){return Array.isArray(x)?x[0]:x&&x.word;}
          const masterSet=new Set(master.map(wordOf).map(norm).filter(Boolean));
          const dailySet=new Set(daily.map(wordOf).map(norm).filter(Boolean));
          const activeSet=new Set(),masteredSet=new Set();
          for(const [k,v] of Object.entries(weak.words||{})){if(v&&v.status==='active')activeSet.add(norm(k));else if(v&&v.status==='mastered')masteredSet.add(norm(k));}
          const overlap=[...activeSet].filter(k=>masteredSet.has(k));
          if(overlap.length)throw new Error('weak active/mastered overlap: '+overlap.slice(0,10).join(','));
          if(masterSet.size!==977)throw new Error('master unique count must be 977, got '+masterSet.size);

          const oralMap=new Map();
          for(const x of vocab){
            const k=norm(x&&x.word); if(!k)continue;
            const isOral=String(x.register||'').trim()==='口语'||String(x.oral||'').trim()!=='';
            if(isOral&&!oralMap.has(k)) oralMap.set(k,{word:x.word,cn:x.cn||'',en:x.en||'',root:x.root||'',oral:x.oral||'',register:x.register||'',topic:x.topic||'',stage:x.stage||'',source_type:x.source_type||'',rank:x.rank??null});
          }
          const oral=[...oralMap.values()];
          if(oral.length!==206)throw new Error('oral candidate count changed; expected 206, got '+oral.length);
          fs.writeFileSync('data/oral-vocab-candidates.js','window.ORAL_VOCAB_CANDIDATES='+JSON.stringify(oral)+';\n','utf8');

          const oralSet=new Set(oral.map(x=>norm(x.word)));
          const inMaster=[...oralSet].filter(k=>masterSet.has(k));
          const newPool=[...masterSet].filter(k=>activeSet.has(k)&&!dailySet.has(k));
          const reviewPool=[...activeSet].filter(k=>dailySet.has(k));
          const oralNew=newPool.filter(k=>oralSet.has(k));
          const oralReview=reviewPool.filter(k=>oralSet.has(k));
          const masteredInMaster=[...masterSet].filter(k=>masteredSet.has(k));
          const activeInMaster=[...masterSet].filter(k=>activeSet.has(k));
          const unjudgedInMaster=[...masterSet].filter(k=>!activeSet.has(k)&&!masteredSet.has(k));

          const audit={
            generated_at:new Date().toISOString(),
            master_unique:masterSet.size,
            weak_active_total:activeSet.size,
            weak_mastered_total:masteredSet.size,
            weak_active_mastered_overlap:overlap.length,
            master_active:activeInMaster.length,
            master_mastered:masteredInMaster.length,
            master_unjudged:unjudgedInMaster.length,
            daily_taught_unique:dailySet.size,
            new_pool_total:newPool.length,
            review_pool_total:reviewPool.length,
            oral_candidates_total:oral.length,
            oral_candidates_in_master:inMaster.length,
            oral_new_pool:oralNew.length,
            oral_review_pool:oralReview.length,
            rules:{
              new_pool:'master977 ∩ weak_active − daily_vocab',
              review_pool:'weak_active ∩ daily_vocab',
              mastered:'excluded from new and重点复习',
              weakness_training:'weak_active ∩ daily_vocab only',
              oral_candidate:'register=口语 OR oral field non-empty',
              oral_daily_target:'约20%；08:00优先2/10，19:00优先1个/3-4新词；只能从合法新词池取，不为凑比例越界'
            }
          };
          fs.writeFileSync('data/learning-pool-audit.json',JSON.stringify(audit,null,2)+'\n');
          fs.writeFileSync('data/learning-pool-rules.json',JSON.stringify({version:1,master_total:977,oral_candidate_total:206,new_pool_formula:'M ∩ A − D',review_pool_formula:'A ∩ D',symbols:{M:'977主学习词库',A:'weak active（当前待掌握）',D:'daily-vocab（已正式教过）',K:'weak mastered（已掌握）'},rules:['K不进入新词或重点复习','未教过的active主词库词=新词','已教过且active=复习词','弱项强化只显示A∩D','口语词候选来自oral-vocab-candidates.js','每日新词约20%口语：08点优先2个，19点优先1个；但口语词仍必须满足M∩A−D'],updated_at:new Date().toISOString()},null,2)+'\n');
          console.log('AUDIT='+JSON.stringify(audit));
          if(oralNew.length<3) console.warn('oral new pool currently below 3; quota will use fallback without violating pool rules');
          NODE
      - name: Commit generated pool and audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oral-vocab-candidates.js data/learning-pool-audit.json data/learning-pool-rules.json
          git rm .github/workflows/build-oral-learning-pool.yml
          git commit -m "Add fixed oral candidate pool and learning rules"
          git push origin HEAD:main
