name: Install static home v3
on:
  push:
    paths:
      - '.github/workflows/install-home-static-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html statically
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          new_modules='''<div class="modules"><button class="module" onclick="go('vocab')"><div>🧠</div><h3>词汇学习</h3><p>词库、闪卡、发音、例句和学习进度。</p><span class="tag" id="vocabTag">加载中...</span></button><button class="module" onclick="openQuickPracticeV2()"><div>⚡</div><h3>快速练习</h3><p>5–10分钟，用最近学过的词做情境选词和补空。</p><span class="tag">主动调用</span></button><button class="module" onclick="go('affix')"><div>🧩</div><h3>前后缀</h3><p>meN-、peN-、ber-、di-、ter-、-kan、-i 等。</p><span class="tag">词根词族</span></button><button class="module" onclick="openWeaknessV2()"><div>🎯</div><h3>弱项强化</h3><p>集中练“模糊 / 不会”和近期陌生词。</p><span class="tag">针对弱项</span></button><button class="module v2-wide" onclick="openExtensiveV2()"><div>📚</div><h3>泛读</h3><p>独立于每日课程：聊天、办公室、生活和真实交流场景。</p><span class="tag">划词查义 · 可加陌生词</span></button></div>'''
          pat=r'<div class="modules">.*?</div></section>\n<section id="daily"'
          repl=new_modules+'</section>\n<section id="daily"'
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'home modules replacement count={n}')
          extra='''\n<section id="quickPractice" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>快速练习</h2><span class="pill" id="quickPracticeMeta"></span></div><div id="quickPracticeBody"></div></div></section>\n<section id="weakness" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>弱项强化</h2><span class="pill" id="weaknessMeta"></span></div><div id="weaknessBody"></div></div></section>\n<section id="extensive" class="page"><button class="back" onclick="go('home')">← 返回首页</button><div class="card"><div class="sectionHead"><h2>泛读</h2><span class="pill" id="extensiveMeta"></span></div><div id="extensiveBody"></div></div></section>\n'''
          if 'id="quickPractice"' not in s2:
              s2=s2.replace('<section id="calendar"',extra+'<section id="calendar"',1)
          # Ensure direct scripts are present, only once.
          s2=re.sub(r'\n<script src="data/home-learning-upgrade\.js\?v=[^"]+"></script>','',s2)
          s2=re.sub(r'\n<script src="data/home-learning-upgrade-v2\.js\?v=[^"]+"></script>','',s2)
          s2=re.sub(r'\n<script src="data/extensive-reading-data\.js\?v=[^"]+"></script>','',s2)
          anchor='<script src="data/today-mastery-test.js?v=20260902-2"></script>'
          inject='<script src="data/extensive-reading-data.js?v=20260903-3"></script>\n<script src="data/home-learning-upgrade-v2.js?v=20260903-2"></script>\n'+anchor
          if anchor not in s2:
              raise SystemExit('script anchor missing')
          s2=s2.replace(anchor,inject,1)
          p.write_text(s2)
          PY
      - name: Verify static home
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          required=['<h3>快速练习</h3>','<h3>弱项强化</h3>','<h3>泛读</h3>','id="quickPractice"','id="weakness"','id="extensive"','home-learning-upgrade-v2.js?v=20260903-2']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          old='<h3>阅读短文</h3><p>直接使用当天每日学习中的短文。</p>'
          if old in s: raise SystemExit('old home reading card still present')
          print('STATIC_HOME_V3_OK')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Install static home learning v3'
          git push
