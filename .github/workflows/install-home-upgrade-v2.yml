name: Install home upgrade V2
on:
  push:
    paths:
      - '.github/workflows/install-home-upgrade-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add V2 script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="data/home-learning-upgrade.js?v=20260903-2"></script>'
          tag='<script src="data/home-learning-upgrade-v2.js?v=20260903-1"></script>'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('home upgrade marker not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Load verified home learning upgrade V2'
          git push
