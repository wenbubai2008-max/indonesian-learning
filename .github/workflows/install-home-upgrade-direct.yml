name: Install home upgrade direct
on:
  push:
    paths:
      - '.github/workflows/install-home-upgrade-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install direct scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="data/unfamiliar-daily-review.js?v=20260903-2"></script>'
          new='''<script src="data/unfamiliar-daily-review.js?v=20260903-3"></script>\n<script src="data/extensive-reading-data.js?v=20260903-2"></script>\n<script src="data/home-learning-upgrade.js?v=20260903-2"></script>'''
          if 'data/home-learning-upgrade.js?v=20260903-2' not in s:
              if old not in s:
                  raise SystemExit('target script tag not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Load home learning upgrade directly'
          git push
