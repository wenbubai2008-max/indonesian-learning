name: Filter weakness training to taught active words

on:
  push:
    paths:
      - '.github/workflows/filter-weakness-to-taught.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch weakness training pool
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const f='data/home-learning-upgrade-v2.js';
          let s=fs.readFileSync(f,'utf8');
          const anchor="  function mem(){try{return JSON.parse(localStorage.getItem('indo_mem')||'{}');}catch(e){return {};}}\n";
          const helper="  function taughtSet(){var s=new Set();(window.DAILY_VOCAB_DB||[]).forEach(function(x){if(x&&x.word)s.add(norm(x.word));});return s;}\n";
          if(!s.includes('function taughtSet(){')){if(!s.includes(anchor))throw new Error('mem anchor not found');s=s.replace(anchor,anchor+helper);}
          s=s.replace("var map=wordMap(),mm=mem(),ps=practiceState(),wp=weakPool(),out=[];","var map=wordMap(),mm=mem(),ps=practiceState(),wp=weakPool(),out=[],taught=taughtSet();");
          s=s.replace("wp.listActive().forEach(function(x){","wp.listActive().filter(function(x){return taught.has(norm(x.word));}).forEach(function(x){");
          s=s.replace("Object.keys(map).forEach(function(k){var x=map[k]","Object.keys(map).forEach(function(k){if(!taught.has(k))return;var x=map[k]");
          s=s.replace("Object.keys(unknown).forEach(function(k){if(keys[k])return;","Object.keys(unknown).forEach(function(k){if(keys[k]||!taught.has(k))return;");
          s=s.replace("目前没有明显弱项 ✓","目前没有需要复习的已学弱项 ✓");
          s=s.replace("模糊、不会、陌生词和快速练习错题会动态进入统一弱项池。","这里只显示已经正式学过、但当前仍是模糊 / 不会 / 答错的词。");
          s=s.replace("这里是统一弱项池的训练视图：陌生词、模糊/不会、快速练习错题都集中到这里。点“会了”后退出强化；以后再次答错会自动回来。","这里只做复习，不提前教新词：仅显示已进入每日课程（daily-vocab）且当前仍为 active 的词。未正式学过的 active 词继续留在新词池或暂存区，不会出现在这里。点“会了”后退出强化；以后再次答错会自动回来。");
          fs.writeFileSync(f,s,'utf8');
          NODE
      - name: Verify rule and commit
        shell: bash
        run: |
          grep -q "wp.listActive().filter(function(x){return taught.has(norm(x.word));})" data/home-learning-upgrade-v2.js
          grep -q "这里只做复习，不提前教新词" data/home-learning-upgrade-v2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/home-learning-upgrade-v2.js
          git rm .github/workflows/filter-weakness-to-taught.yml
          git commit -m "Limit weakness training to taught active words"
          git push origin HEAD:main
