name: Bump vocabulary UI cache 20260913

on:
  push:
    paths:
      - '.github/workflows/bump-vocab-ui-cache-20260913.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant BIPA progress label and bump cache
        run: |
          python - <<'PY'
          import pathlib, re

          # 1) 真正从 BIPA 卡片 DOM / CSS 中删除左上角进度，不再只是隐藏。
          p = pathlib.Path('data/vocab-bipa-final-20260913.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*#vocab \.bipaV7Progress\{[^}]*\}\n?', '\n', s)
          s = s.replace('const d=info(x),p=((pos()%a.length)+a.length)%a.length+1;', 'const d=info(x);')
          s = s.replace('<div class="bipaV7Progress">第 '+"'"+'+p+'+"'"+' / '+"'"+'+a.length+'+"'"+' 个</div>', '')
          p.write_text(s, encoding='utf-8')

          # 2) 切换词库脚本只负责防闪，不再观察/改写已删除的进度元素。
          p = pathlib.Path('data/vocab-bipa-switch-polish-20260913.js')
          p.write_text(r'''(function(){
  if(window.__BIPA_SWITCH_POLISH_V12__)return;
  window.__BIPA_SWITCH_POLISH_V12__=true;
  const $=id=>document.getElementById(id);
  function level(){const s=$('librarySelect'),t=s&&s.selectedIndex>=0?String(s.options[s.selectedIndex]?.textContent||''):'';const m=t.match(/BIPA\s*[（(]?\s*(A1|A2|B1|B2)/i);return m?m[1].toUpperCase():''}
  function isBipa(){return !!level()}
  function addStyle(){
    if($('bipaSwitchPolishStyle'))return;
    const st=document.createElement('style');st.id='bipaSwitchPolishStyle';st.textContent=`
      #vocab.bipaSwitching #vocabBox{opacity:0!important;visibility:hidden!important;}
      #vocab #vocabBox{transition:opacity .08s ease;}
    `;document.head.appendChild(st);
  }
  let switchToken=0;
  function beginSwitch(){
    const sec=$('vocab');if(!sec)return;
    switchToken++;const token=switchToken;
    sec.classList.add('bipaSwitching');
    try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(e){}
    const started=Date.now();
    function check(){
      if(token!==switchToken)return;
      const box=$('vocabBox');
      const ready=!isBipa() || !!(box&&box.querySelector('.bipaV7Card,.bipaStableCard'));
      const badgeCount=box?box.querySelectorAll('.bipaV7Badge,.bipaV8Badge,.bipaSab,.cleanSab').length:0;
      if((ready&&badgeCount<=1&&Date.now()-started>140)||Date.now()-started>1200){
        requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token===switchToken)sec.classList.remove('bipaSwitching')}));
        return;
      }
      setTimeout(check,40);
    }
    setTimeout(check,80);
  }
  addStyle();
  const lib=$('librarySelect');
  if(lib)lib.addEventListener('change',beginSwitch,true);
})();
''', encoding='utf-8')

          # 3) 所有相关脚本统一升到 stable12，确保浏览器拿到真正删除后的版本。
          p = pathlib.Path('data/vocab-memory-feedback.js')
          s = p.read_text(encoding='utf-8').replace('20260913-stable11','20260913-stable12')
          p.write_text(s, encoding='utf-8')

          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'data/vocab-memory-feedback\.js\?v=[^"\']+', 'data/vocab-memory-feedback.js?v=20260913-stable12', s)
          s = re.sub(r'data/pronunciation-fix\.js\?v=[^"\']+', 'data/pronunciation-fix.js?v=20260913-stable12', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit stable12 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/vocab-memory-feedback.js data/vocab-bipa-final-20260913.js data/vocab-bipa-switch-polish-20260913.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove redundant BIPA progress element and bump stable12"
          git push
