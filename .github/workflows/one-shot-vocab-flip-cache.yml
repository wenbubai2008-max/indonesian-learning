name: One-shot vocabulary flip cache bump
on:
  push:
    paths:
      - '.github/workflows/one-shot-vocab-flip-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump vocabulary loader cache and remove one-shot workflow
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='data/vocab-memory-feedback.js?v=20260917-finalcard7'
          new='data/vocab-memory-feedback.js?v=20260917-finalcard8'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('vocab-memory-feedback cache reference not found')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-shot-vocab-flip-cache.yml').unlink()
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-shot-vocab-flip-cache.yml
          git commit -m 'Bump vocabulary flip detail cache'
          git pull --rebase origin main
          git push origin HEAD:main
