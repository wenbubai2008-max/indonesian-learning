name: Append original Day1 vocabulary
on:
  push:
    paths:
      - '.github/workflows/append-day1-vocab.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Day1 words
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('data/daily-vocab-data.js')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'window\.DAILY_VOCAB_DB\s*=\s*(\[.*\])\s*;\s*$',s,re.S)
          if not m: raise SystemExit('daily vocab format not recognized')
          arr=json.loads(m.group(1))
          additions=[
            {"word":"tingkat","cn":"等级、层次","en":"level","root":"tingkat","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"meningkat","cn":"提高、上升","en":"increase / rise","root":"tingkat","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"meningkatkan","cn":"提高某事物","en":"improve / increase something","root":"tingkat","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"peningkatan","cn":"提升、增长","en":"improvement / increase","root":"tingkat","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"ganggu","cn":"打扰","en":"disturb / bother","root":"ganggu","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"mengganggu","cn":"打扰、干扰","en":"disturb / interfere","root":"ganggu","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"pilih","cn":"选择","en":"choose / select","root":"pilih","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"pilihan","cn":"选择、选项","en":"choice / option","root":"pilih","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"untung","cn":"幸运；赚到","en":"lucky / profit","root":"untung","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]},
            {"word":"keuntungan","cn":"利润、好处","en":"profit / advantage","root":"untung","categories":["每日学习","08:00","Day1","原聊天确认"],"times_seen":1,"first_seen":"2026-08-22 08:00","last_seen":"2026-08-22 08:00","sessions":["08:00"],"dates":["2026-08-22"]}
          ]
          by={str(x.get('word','')).strip().lower():x for x in arr}
          for a in additions:
            k=a['word'].lower()
            if k in by:
              x=by[k]
              x['dates']=list(dict.fromkeys((x.get('dates') or [])+a['dates']))
              x['sessions']=list(dict.fromkeys((x.get('sessions') or [])+a['sessions']))
              x['categories']=list(dict.fromkeys((x.get('categories') or [])+a['categories']))
              x['first_seen']=min(x.get('first_seen',a['first_seen']),a['first_seen'])
              x['times_seen']=max(int(x.get('times_seen',1)),len(x['dates']))
            else:
              arr.append(a);by[k]=a
          p.write_text('window.DAILY_VOCAB_DB = '+json.dumps(arr,ensure_ascii=False,indent=2)+';\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-vocab-data.js
          git commit -m "Append original Day1 daily vocabulary" || exit 0
          git push
