name: Disable legacy weak fallback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-legacy-weak-fallback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable old weakness renderer race
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/home-learning-upgrade-v2.js')
          s=p.read_text()
          old="  window.openWeaknessV2=function(){setupPages();go('weakness');renderWeak();};"
          new="  window.openWeaknessV2=function(){setupPages();go('weakness');var body=document.getElementById('weaknessBody');if(body)body.innerHTML='<div class=\"loading\">弱项模块加载中…</div>';};"
          if old not in s: raise SystemExit('legacy openWeakness target not found')
          s=s.replace(old,new)
          old_listener="  window.addEventListener('weak-pool-changed',function(){if(window.__weaknessPagingRootsLoaded)return;if(document.getElementById('weakness')?.classList.contains('active'))setTimeout(renderWeak,0);});\n"
          s=s.replace(old_listener,'')
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'data/home-learning-upgrade-v2\.js\?v=[^\"<]+','data/home-learning-upgrade-v2.js?v=20260915-weak-runtime2',s)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/home-learning-upgrade-v2.js index.html
          git diff --cached --quiet || git commit -m 'Disable legacy weakness renderer race'
          git pull --rebase origin main
          git push origin HEAD:main
