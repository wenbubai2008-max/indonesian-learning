name: Force refresh reading library v3
on:
  push:
    paths:
      - '.github/workflows/bump-reading-library-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump reading script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'data/reading-sync\.js\?v=[^"\']+', 'data/reading-sync.js?v=20260831-4', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh reading library from Aug 30" || exit 0
          git push
