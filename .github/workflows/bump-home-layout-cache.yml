name: Bump home layout cache
on:
  push:
    paths:
      - '.github/workflows/bump-home-layout-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          ns=re.sub(r'home-modules-layout\.js\?v=[0-9-]+','home-modules-layout.js?v=20260904-2',s)
          if ns==s:
              print('No matching home layout script tag found; leaving unchanged')
          else:
              p.write_text(ns)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump home layout cache version'
          git push
