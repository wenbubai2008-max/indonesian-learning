name: Install daily speaking input
on:
  push:
    paths:
      - '.github/workflows/install-daily-speaking-input.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update script includes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data/unfamiliar-daily-review.js'
          if old in s:
              import re
              s=re.sub(r'<script src="data/unfamiliar-daily-review\.js\?v=[^"]+"></script>', '<script src="data/unfamiliar-daily-review.js?v=20260902-2"></script>', s)
          else:
              s=s.replace('</body>', '<script src="data/unfamiliar-daily-review.js?v=20260902-2"></script>\n</body>')
          tag='<script src="data/daily-speaking-input.js?v=20260902-1"></script>'
          if 'data/daily-speaking-input.js' not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Enable daily speaking input and disable separate unfamiliar section"
          git push
