name: Bump unified BIPA vocabulary renderer
on:
  push:
    paths:
      - '.github/workflows/bump-vocab-memory-unified-20260917.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump vocab memory feedback cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='data/vocab-memory-feedback.js?v=20260915-audit1'
          new='data/vocab-memory-feedback.js?v=20260917-unified1'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('vocab-memory-feedback script reference not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump unified BIPA vocabulary renderer cache" || exit 0
          git push
