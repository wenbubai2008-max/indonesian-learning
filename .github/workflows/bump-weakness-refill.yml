name: Bump weakness refill cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-weakness-refill.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data/weakness-paging-roots.js?v=20260915-roots6','data/weakness-paging-roots.js?v=20260915-roots7')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh weakness refill pagination runtime'
          git pull --rebase origin main
          git push origin HEAD:main
