name: Install learning loop v2
on:
  push:
    paths:
      - '.github/workflows/install-learning-loop-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update script loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          pool='<script src="data/weakness-pool.js?v=20260915-runtime1"></script>'
          paging='<script src="data/weakness-paging-roots.js?v=20260915-runtime2"></script>'
          if 'data/weakness-pool.js' not in s:
              s=s.replace('<script src="data/reading-word-lookup.js', pool+'\n<script src="data/reading-word-lookup.js')
          if 'data/weakness-paging-roots.js' not in s:
              s=s.replace('<script src="data/extensive-reading-history-ui.js', paging+'\n<script src="data/extensive-reading-history-ui.js')
          else:
              import re
              s=re.sub(r'data/weakness-paging-roots\.js\?v=[^"<]+','data/weakness-paging-roots.js?v=20260915-runtime2',s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Load unified weakness runtime'
          git push
