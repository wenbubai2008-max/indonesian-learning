name: Install learning loop v2
on:
  push:
    paths:
      - '.github/workflows/install-learning-loop-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update script loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          pool='<script src="data/weakness-pool.js?v=20260915-runtime1"></script>'
          paging='<script src="data/weakness-paging-roots.js?v=20260915-runtime2"></script>'
          if 'data/weakness-pool.js' not in s:
              s=s.replace('<script src="data/reading-word-lookup.js', pool+'\n<script src="data/reading-word-lookup.js')
          if 'data/weakness-paging-roots.js' not in s:
              s=s.replace('<script src="data/extensive-reading-history-ui.js', paging+'\n<script src="data/extensive-reading-history-ui.js')
          else:
              s=re.sub(r'data/weakness-paging-roots\.js\?v=[^"<]+','data/weakness-paging-roots.js?v=20260915-runtime2',s)
          s=re.sub(r'data/home-learning-upgrade-v2\.js\?v=[^"<]+','data/home-learning-upgrade-v2.js?v=20260915-weak-runtime1',s)
          p.write_text(s)

          q=Path('data/home-learning-upgrade-v2.js')
          t=q.read_text()
          old="window.addEventListener('weak-pool-changed',function(){if(document.getElementById('weakness')?.classList.contains('active'))setTimeout(renderWeak,0);});"
          new="window.addEventListener('weak-pool-changed',function(){if(window.__weaknessPagingRootsLoaded)return;if(document.getElementById('weakness')?.classList.contains('active'))setTimeout(renderWeak,0);});"
          if old in t:
              t=t.replace(old,new)
          q.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html data/home-learning-upgrade-v2.js
          git diff --cached --quiet || git commit -m 'Prevent legacy weakness rerender conflicts'
          git push
