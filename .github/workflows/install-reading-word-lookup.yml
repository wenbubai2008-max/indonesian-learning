name: Install reading word lookup
on:
  push:
    paths:
      - '.github/workflows/install-reading-word-lookup.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="data/reading-word-lookup.js?v=20260831-1"></script>'
          if old not in s:
              s=s.replace('</body>', old+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable inline reading word lookup" || exit 0
          git push
