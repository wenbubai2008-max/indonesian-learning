name: Rebuild exact 977-word master vocabulary

on:
  push:
    paths:
      - '.github/workflows/rebuild-master-977.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct merge-time 977-word master
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const cp = require('child_process');

          const BEFORE = '29c309829282765ac7fb1bc829fd1e4ab7c16983'; // 00:10:50 Jakarta, last sync before original merge
          const AFTER  = '1083bfbb0bb49b8e3dded7c7614ea0ac3824a01d'; // 01:40:49 Jakarta, first sync after original merge
          const MERGE_TIME = Date.parse('2026-09-12T17:15:48Z'); // original merge commit time
          const MASTER_FILES = ['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'];
          const norm = w => String(w || '').trim().toLowerCase();

          function loadMaster() {
            const ctx = { window: { MASTER_VOCAB_DB: [] } };
            for (const f of MASTER_FILES) vm.runInNewContext(fs.readFileSync(f, 'utf8'), ctx, { filename: f });
            const seen = new Set(), out = [];
            for (const raw of ctx.window.MASTER_VOCAB_DB || []) {
              const word = Array.isArray(raw) ? raw[0] : raw && raw.word;
              const cn = Array.isArray(raw) ? (raw[1] || '') : (raw && raw.cn) || '';
              const k = norm(word);
              if (!k || seen.has(k)) continue;
              seen.add(k); out.push([String(word).trim(), String(cn || '').trim()]);
            }
            return out;
          }

          function loadTop1000() {
            const ctx = { window: {} };
            vm.runInNewContext(fs.readFileSync('data/vocab-data.js', 'utf8'), ctx, { filename: 'data/vocab-data.js' });
            const seen = new Set(), out = [];
            for (const x of ctx.window.EMBEDDED_DB || []) {
              if (!x || !x.word) continue;
              const k = norm(x.word);
              if (!k || seen.has(k)) continue;
              seen.add(k); out.push(x);
            }
            return out;
          }

          function weakAt(sha) {
            return JSON.parse(cp.execFileSync('git', ['show', `${sha}:data/weakness-sync.json`], { encoding: 'utf8', maxBuffer: 30 * 1024 * 1024 }));
          }

          const core = loadMaster();
          if (core.length !== 800) throw new Error(`Expected current refined core to be 800, got ${core.length}`);
          const top = loadTop1000();
          const before = weakAt(BEFORE);
          const after = weakAt(AFTER);

          // Rebuild browser learning state at the exact moment the original merge was introduced.
          // Start from the final synced state before the merge. For records visible in the first later sync,
          // only apply updates whose own updated_at is at/before the merge timestamp. Later changes are ignored.
          const state = new Map();
          for (const [k,v] of Object.entries(before.words || {})) state.set(norm(k), v);
          for (const [k,v] of Object.entries(after.words || {})) {
            const t = Date.parse(v && v.updated_at || '');
            if (Number.isFinite(t) && t <= MERGE_TIME) state.set(norm(k), v);
          }

          const coreSet = new Set(core.map(x => norm(x[0])));
          const additions = [];
          for (const x of top) {
            const k = norm(x.word);
            if (!k || coreSet.has(k)) continue;
            const r = state.get(k);
            if (!r || r.status !== 'active') continue;
            const reasons = Array.isArray(r.reasons) ? r.reasons : [];
            if (!reasons.includes('memory_fuzzy') && !reasons.includes('memory_dont')) continue;
            additions.push([String(x.word).trim(), String(x.cn || '').trim()]);
          }

          const diagnostic = {
            base_core: core.length,
            top1000: top.length,
            reconstructed_additions: additions.length,
            reconstructed_total: core.length + additions.length,
            before_snapshot: BEFORE,
            after_snapshot: AFTER,
            merge_time_utc: new Date(MERGE_TIME).toISOString(),
            method: 'state before merge + after-snapshot records whose own updated_at <= original merge time'
          };
          fs.writeFileSync('data/master-vocab-977-diagnostic.json', JSON.stringify(diagnostic, null, 2) + '\n');
          console.log(JSON.stringify(diagnostic));

          if (additions.length !== 177) {
            console.error(`Expected exactly 177 additions for the agreed 977 master; reconstructed ${additions.length}.`);
            process.exitCode = 22;
          } else {
            const all = [...core, ...additions];
            const unique = new Set(all.map(x => norm(x[0])));
            if (all.length !== 977 || unique.size !== 977) throw new Error(`Expected exactly 977 unique words, got rows=${all.length}, unique=${unique.size}`);

            const sizes = [326,326,325];
            let pos = 0;
            for (let i=0;i<3;i++) {
              const chunk = all.slice(pos, pos + sizes[i]); pos += sizes[i];
              fs.writeFileSync(MASTER_FILES[i], 'window.MASTER_VOCAB_DB=(window.MASTER_VOCAB_DB||[]).concat(' + JSON.stringify(chunk) + ');\n', 'utf8');
            }
            const manifest = {
              version: 1,
              total: 977,
              base_core: 800,
              fixed_additions: 177,
              source: 'reconstructed exact browser state at original Top1000 weak-word merge time',
              before_snapshot: BEFORE,
              after_snapshot: AFTER,
              merge_time_utc: new Date(MERGE_TIME).toISOString(),
              dynamic_top1000_merge: false,
              generated_at: new Date().toISOString()
            };
            fs.writeFileSync('data/master-vocab-977-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            let s = fs.readFileSync('data/library-switcher.js','utf8');
            s = s.replaceAll('20260912-core1','20260913-master977-v2').replaceAll('20260913-master977-v1','20260913-master977-v2');
            fs.writeFileSync('data/library-switcher.js',s,'utf8');
          }
          NODE

      - name: Commit exact result or diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/master-vocab-977-manifest.json ]; then
            node -e "const m=require('./data/master-vocab-977-manifest.json'); if(m.total!==977||m.fixed_additions!==177) process.exit(1)"
            git add data/master-vocab-data.js data/master-vocab-data-2.js data/master-vocab-data-3.js data/master-vocab-977-manifest.json data/master-vocab-977-diagnostic.json data/library-switcher.js
            git rm .github/workflows/rebuild-master-977.yml
            git commit -m "Restore exact fixed 977-word master vocabulary"
            git push origin HEAD:main
          else
            git add data/master-vocab-977-diagnostic.json
            git commit -m "Diagnose historical 977-word master reconstruction" || true
            git push origin HEAD:main
          fi
