name: Trace exact 977-word master vocabulary

on:
  push:
    paths:
      - '.github/workflows/rebuild-master-977.yml'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace merge-time candidates
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const BEFORE='29c309829282765ac7fb1bc829fd1e4ab7c16983';
          const AFTER='1083bfbb0bb49b8e3dded7c7614ea0ac3824a01d';
          const MERGE=Date.parse('2026-09-12T17:15:48Z');
          const files=['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'];
          const norm=w=>String(w||'').trim().toLowerCase();
          function loadMaster(){const c={window:{MASTER_VOCAB_DB:[]}};files.forEach(f=>vm.runInNewContext(fs.readFileSync(f,'utf8'),c));const seen=new Set(),o=[];for(const r of c.window.MASTER_VOCAB_DB){const w=Array.isArray(r)?r[0]:r.word,cn=Array.isArray(r)?r[1]||'':r.cn||'',k=norm(w);if(k&&!seen.has(k)){seen.add(k);o.push([String(w).trim(),String(cn).trim()]);}}return o;}
          function loadTop(){const c={window:{}};vm.runInNewContext(fs.readFileSync('data/vocab-data.js','utf8'),c);return c.window.EMBEDDED_DB||[];}
          function weak(sha){return JSON.parse(cp.execFileSync('git',['show',`${sha}:data/weakness-sync.json`],{encoding:'utf8',maxBuffer:30*1024*1024}));}
          const core=loadMaster(),top=loadTop(),before=weak(BEFORE),after=weak(AFTER),coreSet=new Set(core.map(x=>norm(x[0])));
          const state=new Map(Object.entries(before.words||{}).map(([k,v])=>[norm(k),v]));
          for(const [k,v] of Object.entries(after.words||{})){const t=Date.parse(v?.updated_at||'');if(Number.isFinite(t)&&t<=MERGE)state.set(norm(k),v);}
          const candidates=[];
          for(const x of top){const k=norm(x.word);if(!k||coreSet.has(k))continue;const r=state.get(k);const reasons=Array.isArray(r?.reasons)?r.reasons:[];if(r?.status==='active'&&(reasons.includes('memory_fuzzy')||reasons.includes('memory_dont'))){const a=after.words?.[k]||null;candidates.push({word:x.word,cn:x.cn||'',at_merge_status:r.status,at_merge_reasons:reasons,at_merge_updated_at:r.updated_at||null,after_status:a?.status||null,after_updated_at:a?.updated_at||null,after_reasons:a?.reasons||[],minutes_after_merge:a?.updated_at?((Date.parse(a.updated_at)-MERGE)/60000):null});}}
          const masteredAfter=candidates.filter(x=>x.after_status==='mastered'&&Number.isFinite(x.minutes_after_merge)&&x.minutes_after_merge>0).sort((a,b)=>a.minutes_after_merge-b.minutes_after_merge);
          const activeChangedAfter=candidates.filter(x=>x.after_updated_at&&Date.parse(x.after_updated_at)>MERGE).sort((a,b)=>a.minutes_after_merge-b.minutes_after_merge);
          const out={core:core.length,candidates:candidates.length,total:core.length+candidates.length,mastered_after_merge_count:masteredAfter.length,mastered_after_merge:masteredAfter,all_candidate_changes_after_merge:activeChangedAfter};
          fs.writeFileSync('data/master-vocab-977-candidate-transitions.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({core:out.core,candidates:out.candidates,total:out.total,mastered_after_merge_count:out.mastered_after_merge_count,first_mastered:masteredAfter.slice(0,10)}));
          NODE
      - name: Commit trace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-vocab-977-candidate-transitions.json
          git commit -m "Trace historical 977 master candidate transitions" || true
          git push origin HEAD:main
