name: Finalize fixed 977-word master vocabulary

on:
  push:
    paths:
      - '.github/workflows/rebuild-master-977.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build fixed 977 master
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          const BEFORE='29c309829282765ac7fb1bc829fd1e4ab7c16983';
          const AFTER='1083bfbb0bb49b8e3dded7c7614ea0ac3824a01d';
          const MERGE=Date.parse('2026-09-12T17:15:48Z');
          const files=['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'];
          const norm=w=>String(w||'').trim().toLowerCase();

          function loadMaster(){
            const c={window:{MASTER_VOCAB_DB:[]}};files.forEach(f=>vm.runInNewContext(fs.readFileSync(f,'utf8'),c,{filename:f}));
            const seen=new Set(),o=[];
            for(const r of c.window.MASTER_VOCAB_DB||[]){const w=Array.isArray(r)?r[0]:r?.word,cn=Array.isArray(r)?r[1]||'':r?.cn||'',k=norm(w);if(k&&!seen.has(k)){seen.add(k);o.push([String(w).trim(),String(cn).trim()]);}}
            return o;
          }
          function loadTop(){
            const c={window:{}};vm.runInNewContext(fs.readFileSync('data/vocab-data.js','utf8'),c,{filename:'data/vocab-data.js'});
            const seen=new Set(),out=[];let i=0;
            for(const x of c.window.EMBEDDED_DB||[]){const k=norm(x?.word);if(!k||seen.has(k))continue;seen.add(k);out.push(Object.assign({_source_index:i++},x));}
            return out;
          }
          function weak(sha){return JSON.parse(cp.execFileSync('git',['show',`${sha}:data/weakness-sync.json`],{encoding:'utf8',maxBuffer:30*1024*1024}));}

          const core=loadMaster();
          if(core.length!==800)throw new Error(`Expected 800-word refined base core, got ${core.length}`);
          const top=loadTop(),before=weak(BEFORE),after=weak(AFTER),coreSet=new Set(core.map(x=>norm(x[0])));
          const state=new Map(Object.entries(before.words||{}).map(([k,v])=>[norm(k),v]));
          for(const [k,v] of Object.entries(after.words||{})){const t=Date.parse(v?.updated_at||'');if(Number.isFinite(t)&&t<=MERGE)state.set(norm(k),v);}

          const candidates=[];
          for(const x of top){const k=norm(x.word);if(coreSet.has(k))continue;const r=state.get(k),reasons=Array.isArray(r?.reasons)?r.reasons:[];if(r?.status!=='active'||(!reasons.includes('memory_fuzzy')&&!reasons.includes('memory_dont')))continue;candidates.push({word:String(x.word).trim(),cn:String(x.cn||'').trim(),rank:Number.isFinite(Number(x.rank))?Number(x.rank):100000+x._source_index,source_index:x._source_index,reasons});}
          if(candidates.length!==179)throw new Error(`Expected 179 reconstructable historical candidates, got ${candidates.length}`);

          // The browser-only indo_mem snapshot that produced the agreed 977 count was never committed.
          // Cloud history reconstructs 179 candidates (2 more). Keep the 177 highest-priority Top1000 items
          // by the original rank, which preserves the agreed 977 total without reintroducing later dynamic merging.
          candidates.sort((a,b)=>a.rank-b.rank||a.source_index-b.source_index||a.word.localeCompare(b.word));
          const keep=candidates.slice(0,177),drop=candidates.slice(177);
          const all=[...core,...keep.map(x=>[x.word,x.cn])];
          const unique=new Set(all.map(x=>norm(x[0])));
          if(all.length!==977||unique.size!==977)throw new Error(`Expected 977 unique words, got rows=${all.length}, unique=${unique.size}`);

          const sizes=[326,326,325];let p=0;
          files.forEach((f,i)=>{const chunk=all.slice(p,p+sizes[i]);p+=sizes[i];fs.writeFileSync(f,'window.MASTER_VOCAB_DB=(window.MASTER_VOCAB_DB||[]).concat('+JSON.stringify(chunk)+');\n','utf8');});

          const manifest={version:2,total:977,base_core:800,fixed_top1000_additions:177,reconstructed_candidates:179,selection_rule:'keep the 177 highest-priority historical Top1000 fuzzy/dont candidates by original rank',dropped_to_fix_historical_count:drop.map(x=>({word:x.word,cn:x.cn,rank:x.rank})),before_snapshot:BEFORE,after_snapshot:AFTER,original_merge_time_utc:new Date(MERGE).toISOString(),dynamic_top1000_merge:false,generated_at:new Date().toISOString()};
          fs.writeFileSync('data/master-vocab-977-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          let s=fs.readFileSync('data/library-switcher.js','utf8');
          s=s.replaceAll('20260912-core1','20260913-master977-final').replaceAll('20260913-master977-v1','20260913-master977-final').replaceAll('20260913-master977-v2','20260913-master977-final');
          fs.writeFileSync('data/library-switcher.js',s,'utf8');
          console.log(JSON.stringify({total:all.length,unique:unique.size,base:core.length,additions:keep.length,dropped:manifest.dropped_to_fix_historical_count}));
          NODE
      - name: Verify and commit
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');const c={window:{MASTER_VOCAB_DB:[]}};['data/master-vocab-data.js','data/master-vocab-data-2.js','data/master-vocab-data-3.js'].forEach(f=>vm.runInNewContext(fs.readFileSync(f,'utf8'),c));const a=c.window.MASTER_VOCAB_DB||[],s=new Set(a.map(x=>String(Array.isArray(x)?x[0]:x.word).trim().toLowerCase()));const m=require('./data/master-vocab-977-manifest.json');if(a.length!==977||s.size!==977||m.total!==977||m.fixed_top1000_additions!==177)throw new Error(JSON.stringify({rows:a.length,unique:s.size,manifest:m}));console.log('verified 977 unique master words');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/master-vocab-977-diagnostic.json data/master-vocab-977-candidate-transitions.json
          git add -A data/master-vocab-data.js data/master-vocab-data-2.js data/master-vocab-data-3.js data/master-vocab-977-manifest.json data/library-switcher.js data/master-vocab-977-diagnostic.json data/master-vocab-977-candidate-transitions.json
          git rm .github/workflows/rebuild-master-977.yml
          git commit -m "Restore final fixed 977-word master vocabulary"
          git push origin HEAD:main
