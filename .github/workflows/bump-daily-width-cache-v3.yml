name: Bump daily width cache v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-daily-width-cache-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump width CSS cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data/daily-width-fix.css?v=20260901-2','data/daily-width-fix.css?v=20260901-3')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Bump daily width CSS cache v3'
          git push
