name: Build vocabulary profile

on:
  push:
    branches: [main]
    paths:
      - 'data/weakness-sync.json'
      - 'data/daily-vocab-data.js'
      - 'data/learning-runtime.json'
      - 'data/vocab-profile-ui.js'
      - '.github/scripts/build-vocab-profile.js'
      - '.github/scripts/inject-vocab-profile.js'
      - '.github/workflows/build-vocab-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vocab-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build profile
        run: |
          set -e
          node --check .github/scripts/build-vocab-profile.js
          node --check .github/scripts/inject-vocab-profile.js
          node --check data/vocab-profile-ui.js
          node .github/scripts/build-vocab-profile.js
          node .github/scripts/inject-vocab-profile.js
      - name: Commit profile
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/vocab-profile.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build personal vocabulary profile'
          git pull --rebase origin main
          git push origin HEAD:main
