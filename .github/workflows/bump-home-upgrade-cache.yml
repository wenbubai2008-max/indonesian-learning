name: Bump home upgrade cache
on:
  push:
    paths:
      - '.github/workflows/bump-home-upgrade-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data/unfamiliar-daily-review.js?v=20260902-2','data/unfamiliar-daily-review.js?v=20260903-1')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Bump home learning upgrade cache'
          git push
