name: Refresh weakness training cache

on:
  push:
    paths:
      - '.github/workflows/bump-weakness-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data/home-learning-upgrade-v2.js?v=20260903-4'
          new='data/home-learning-upgrade-v2.js?v=20260913-weak-review1'
          if old not in s and new not in s:
              raise SystemExit('script reference not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bump-weakness-cache.yml
          git commit -m "Refresh weakness training cache version"
          git push origin HEAD:main
