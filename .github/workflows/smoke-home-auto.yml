name: Smoke home automation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-home-auto.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install jsdom
        run: npm install --no-save jsdom@24
      - name: Run browser-like smoke test
        run: |
          cd ..
          python3 -m http.server 8000 >/tmp/indo-http.log 2>&1 &
          cd "$GITHUB_WORKSPACE"
          cat >/tmp/smoke.mjs <<'JS'
          import {JSDOM, VirtualConsole} from 'jsdom';
          import assert from 'node:assert/strict';

          const errors=[];
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push('jsdomError: '+e.message));
          vc.on('error',(...a)=>errors.push('console.error: '+a.join(' ')));

          const fixed=Date.parse('2026-09-19T19:00:00+07:00');
          const dom=await JSDOM.fromURL('http://127.0.0.1:8000/indonesian-learning/',{
            resources:'usable',
            runScripts:'dangerously',
            pretendToBeVisual:true,
            virtualConsole:vc,
            beforeParse(w){
              const NativeDate=w.Date;
              class FakeDate extends NativeDate{
                constructor(...args){super(...(args.length?args:[fixed]));}
                static now(){return fixed;}
              }
              FakeDate.parse=NativeDate.parse;
              FakeDate.UTC=NativeDate.UTC;
              w.Date=FakeDate;
              w.scrollTo=()=>{};
              w.requestIdleCallback=(cb)=>w.setTimeout(()=>cb({didTimeout:false,timeRemaining:()=>50}),0);
              w.cancelIdleCallback=(id)=>w.clearTimeout(id);
              w.matchMedia=()=>({matches:false,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){}});
              w.ResizeObserver=class{observe(){} unobserve(){} disconnect(){}};
              w.speechSynthesis={getVoices:()=>[],cancel(){},speak(){},paused:false,resume(){}};
              w.SpeechSynthesisUtterance=class{constructor(t){this.text=t;}};
            }
          });
          const w=dom.window;
          w.addEventListener('error',e=>errors.push('window.error: '+(e.error?.stack||e.message)));

          async function waitFor(fn,label,ms=8000){
            const start=Date.now();
            while(Date.now()-start<ms){
              try{if(fn())return;}catch{}
              await new Promise(r=>setTimeout(r,50));
            }
            throw new Error('timeout: '+label);
          }
          await waitFor(()=>w.renderHomeModules&&w.openQuickPracticeV2&&w.openAutomationTraining,'core functions');
          await new Promise(r=>setTimeout(r,700));

          const titles=[...w.document.querySelectorAll('#homeModules > .module h3')].map(x=>x.textContent.trim());
          assert.deepEqual(titles,['词汇学习','泛读','快速练习','弱项强化','自动训练','难点解释','前后缀']);
          assert.equal(w.document.querySelectorAll('#homeModules').length,1);
          assert.equal(w.document.querySelectorAll('#difficultyModule').length,1);
          assert.equal(w.document.querySelectorAll('#automationTag').length,1);

          w.openQuickPracticeV2();
          await new Promise(r=>setTimeout(r,50));
          const first=w.document.querySelector('#quickPracticeBody .v2-q');
          assert.ok(first,'quick practice should have at least one due question in fixed test date');
          const word=first.dataset.answer;
          const correct=[...first.querySelectorAll('.v2-opts button')].find(b=>b.dataset.v===word);
          assert.ok(correct,'correct quick-practice option missing');
          correct.click();
          w.refreshQuickPracticeV2();
          await new Promise(r=>setTimeout(r,20));
          const answers=[...w.document.querySelectorAll('#quickPracticeBody .v2-q')].map(x=>x.dataset.answer);
          assert.ok(!answers.includes(word),'just-correct quick-practice word reappeared during cooldown');

          const latest=(w.DAILY_VOCAB_DB||[]).filter(x=>x&&x.word&&x.cn).sort((a,b)=>String(b.last_seen||'').localeCompare(String(a.last_seen||'')))[0];
          assert.ok(latest,'daily vocab missing');
          const k=String(latest.word).trim().toLowerCase();
          const now=w.Date.now();
          w.localStorage.setItem('indo_quick_practice_state',JSON.stringify({[k]:{right:0,wrong:1,streak:0,last_result:'wrong',last_wrong:now,last:now}}));
          w.localStorage.removeItem('indo_automation_training_plan_v1');
          w.openAutomationTraining();
          await new Promise(r=>setTimeout(r,30));
          assert.ok(w.document.querySelector('#automationTraining'),'automation page missing');
          assert.ok([...w.document.querySelectorAll('#automationTraining .autoCard')].some(x=>x.dataset.word===latest.word),'recent quick-practice wrong word was not selected for automation');

          const jsErrors=errors.filter(x=>!/Not implemented: HTMLMediaElement/.test(x));
          assert.deepEqual(jsErrors,[],jsErrors.join('\n'));
          console.log('SMOKE_OK');
          console.log('HOME_ORDER='+titles.join(' > '));
          console.log('QUICK_COOLDOWN_OK='+word);
          console.log('AUTOMATION_PICK_OK='+latest.word);
          dom.window.close();
          JS
          node /tmp/smoke.mjs
