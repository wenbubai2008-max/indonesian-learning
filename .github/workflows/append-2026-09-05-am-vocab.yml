name: Append 2026-09-05 AM vocab
on:
  push:
    paths:
      - '.github/workflows/append-2026-09-05-am-vocab.yml'
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append or patch daily vocab safely
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lesson = json.loads(Path('data/daily/2026-09-05-am.json').read_text(encoding='utf-8'))
          p = Path('data/daily-vocab-data.js')
          text = p.read_text(encoding='utf-8').strip()
          prefix = 'window.DAILY_VOCAB_DB = '
          if not text.startswith(prefix) or not text.endswith(';'):
              raise SystemExit('Unexpected DAILY_VOCAB_DB format')
          db = json.loads(text[len(prefix):-1])
          by_word = {str(x.get('word','')).lower(): x for x in db}
          for v in lesson['vocab']:
              key = v['word'].lower()
              x = by_word.get(key)
              if x is None:
                  x = {
                      'word': v['word'],
                      'cn': v['cn'],
                      'en': v['en'],
                      'times_seen': 1,
                      'first_seen': '2026-09-05 08:00',
                      'last_seen': '2026-09-05 08:00',
                      'sessions': ['08:00'],
                      'dates': ['2026-09-05']
                  }
                  db.append(x)
                  by_word[key] = x
              x['cn'] = v['cn']
              x['en'] = v['en']
              x['root'] = v['root']
              x['root_cn'] = v['root_cn']
              x['example'] = v['example']
              x['example_cn'] = v['example_cn']
              x['categories'] = list(dict.fromkeys((x.get('categories') or []) + ['每日学习','08:00']))
              x['last_seen'] = '2026-09-05 08:00'
              x['sessions'] = list(dict.fromkeys((x.get('sessions') or []) + ['08:00']))
              x['dates'] = list(dict.fromkeys((x.get('dates') or []) + ['2026-09-05']))
          p.write_text(prefix + json.dumps(db, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')
          PY
      - name: Commit updated vocab library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-vocab-data.js
          git commit -m "Patch 2026-09-05 AM vocabulary metadata" || exit 0
          git push
