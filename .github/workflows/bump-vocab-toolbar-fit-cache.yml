name: Bump vocab toolbar fit cache
on:
  push:
    paths:
      - '.github/workflows/bump-vocab-toolbar-fit-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data/vocab-memory-feedback.js?v=20260917-finalcard6'
          new='data/vocab-memory-feedback.js?v=20260917-finalcard7'
          if old not in s and new not in s:
              raise SystemExit('vocab-memory-feedback script tag not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump vocab toolbar fit cache'
          git push
