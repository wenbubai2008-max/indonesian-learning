name: Fix daily reading lookup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-reading-lookup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden daily reading word lookup
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/reading-word-lookup.js')
          s=p.read_text()
          s=s.replace("Array.isArray(window.EMBEDDED_DB)?window.EMBEDDED_DB:[],\n      Array.isArray(window.DAILY_VOCAB_DB)?window.DAILY_VOCAB_DB:[],\n      Array.isArray(window.UNFAMILIAR_VOCAB_DB)?window.UNFAMILIAR_VOCAB_DB:[],\n      Array.isArray(window.MASTER_VOCAB_OBJECTS)?window.MASTER_VOCAB_OBJECTS:[]", "Array.isArray(window.DAILY_VOCAB_DB)?window.DAILY_VOCAB_DB:[],\n      Array.isArray(window.UNFAMILIAR_VOCAB_DB)?window.UNFAMILIAR_VOCAB_DB:[],\n      Array.isArray(window.MASTER_VOCAB_OBJECTS)?window.MASTER_VOCAB_OBJECTS:[],\n      Array.isArray(window.EMBEDDED_DB)?window.EMBEDDED_DB:[]")
          norm_old="  function norm(s){return String(s||'').trim().toLowerCase().replace(/^[^a-zA-ZÀ-ÿ]+|[^a-zA-ZÀ-ÿ-]+$/g,'');}"
          norm_new=norm_old+"\n  function plainNorm(s){const w=norm(s);if(!w)return '';try{return w.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');}catch(e){return w;}}"
          if 'function plainNorm(' not in s:
            if norm_old not in s: raise SystemExit('norm target missing')
            s=s.replace(norm_old,norm_new)
          lookup_old="  function lookup(raw,node){\n    const fromHint=hintLookup(node,raw);if(fromHint)return fromHint;\n    const w=norm(raw);if(!w)return null;\n    const p=weakPool(),pooled=p&&typeof p.get==='function'?p.get(w):null;if(pooled&&pooled.cn)return hitFromRecord(raw,pooled,w);\n    const variants=[w];\n    if(/-(ku|mu|nya)$/.test(w))variants.push(w.replace(/-(ku|mu|nya)$/,''));\n    if(/(ku|mu|nya)$/.test(w)&&w.length>5)variants.push(w.replace(/(ku|mu|nya)$/,''));\n    const words=allWords();\n    for(const v of variants){const hit=words.find(x=>x&&(norm(x.word)===v||norm(x.display)===v||norm(x.audio_text)===v));if(hit)return hitFromRecord(raw,hit,v);}\n    return {word:String(raw).trim(),base:w,cn:persistentCached(w),en:'',root:'',root_cn:'',example:'',example_cn:''};\n  }"
          lookup_new="  function lookup(raw,node){\n    const fromHint=hintLookup(node,raw);if(fromHint)return fromHint;\n    const w=norm(raw),plain=plainNorm(raw);if(!w)return null;\n    const p=weakPool(),pooled=p&&typeof p.get==='function'?(p.get(w)||(plain!==w?p.get(plain):null)):null;if(pooled&&pooled.cn)return hitFromRecord(raw,pooled,plain||w);\n    const variants=[];[w,plain].forEach(function(v){if(v&&!variants.includes(v))variants.push(v);});\n    variants.slice().forEach(function(v){if(/-(ku|mu|nya)$/.test(v)){const x=v.replace(/-(ku|mu|nya)$/,'');if(x&&!variants.includes(x))variants.push(x);}if(/(ku|mu|nya)$/.test(v)&&v.length>5){const x=v.replace(/(ku|mu|nya)$/,'');if(x&&!variants.includes(x))variants.push(x);}});\n    const words=allWords();\n    for(const v of variants){const hit=words.find(x=>x&&(plainNorm(x.word)===v||plainNorm(x.display)===v||plainNorm(x.audio_text)===v));if(hit)return hitFromRecord(raw,hit,v);}\n    const base=plain||w;return {word:String(raw).trim(),base:base,cn:persistentCached(base)||persistentCached(w),en:'',root:'',root_cn:'',example:'',example_cn:''};\n  }"
          if lookup_old in s: s=s.replace(lookup_old,lookup_new)
          elif 'const w=norm(raw),plain=plainNorm(raw)' not in s: raise SystemExit('lookup target missing')
          s=s.replace("node.closest('.rl-text,.dailyFixReading')","node.closest('.rl-text,.dailyFixReading,#daily .reading')")
          src_old="  function sourceInfo(node){\n    const daily=node.closest('#daily');if(daily)return {date:(document.getElementById('dailyMeta')&&document.getElementById('dailyMeta').textContent||'').trim(),session:(document.getElementById('dailyTitle')&&document.getElementById('dailyTitle').textContent||'').includes('19:00')?'19:00':'08:00',source:'每日学习阅读'};\n    const extensive=node.closest('#extensive');if(extensive)return {date:(document.getElementById('extensiveMeta')&&document.getElementById('extensiveMeta').textContent||'').split('·')[0].trim(),session:'',source:'泛读'};\n    return {date:'',session:'',source:'阅读短文'};\n  }"
          src_new="  function sourceInfo(node){\n    const daily=node.closest('#daily');\n    if(daily){const date=(document.getElementById('dailyMeta')&&document.getElementById('dailyMeta').textContent||'').trim();const nav=daily.querySelector('.dailyFixMid span');const title=document.getElementById('dailyTitle');const label=String((nav&&nav.textContent)||(title&&title.textContent)||'');const session=/19:00|晚间/.test(label)?'19:00':(/08:00|早间/.test(label)?'08:00':'');return {date:date,session:session,source:'每日学习阅读'};}\n    const readingPage=node.closest('#readingPage');if(readingPage){const meta=String(document.getElementById('readingMeta')&&document.getElementById('readingMeta').textContent||'');const dm=meta.match(/\\b(20\\d{2}-\\d{2}-\\d{2})\\b/),tm=meta.match(/\\b(08:00|19:00)\\b/);return {date:dm?dm[1]:'',session:tm?tm[1]:'',source:'每日阅读库'};}\n    const extensive=node.closest('#extensive');if(extensive)return {date:(document.getElementById('extensiveMeta')&&document.getElementById('extensiveMeta').textContent||'').split('·')[0].trim(),session:'',source:'泛读'};\n    return {date:'',session:'',source:'阅读短文'};\n  }"
          if src_old in s: s=s.replace(src_old,src_new)
          elif "source:'每日阅读库'" not in s: raise SystemExit('sourceInfo target missing')
          p.write_text(s)
          p=Path('index.html');s=p.read_text();s=re.sub(r'data/reading-word-lookup\.js\?v=[^\"<]+','data/reading-word-lookup.js?v=20260915-dailylookup1',s);p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reading-word-lookup.js index.html
          git diff --cached --quiet || git commit -m 'Harden daily reading word lookup'
          git pull --rebase origin main
          git push origin HEAD:main
