name: Refresh vocab progress cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-vocab-progress-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump library switcher cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'data/library-switcher\.js\?v=[^"\']+', 'data/library-switcher.js?v=20260901-4', s)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh vocab progress cache"
          git push
