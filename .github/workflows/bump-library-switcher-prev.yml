name: Bump library switcher cache for previous button
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-library-switcher-prev.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump library switcher version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data/library-switcher.js?v=20260902-2','data/library-switcher.js?v=20260902-3')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Bump library switcher cache for previous button'
          git push
