name: Append 2026-09-13 PM vocabulary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-vocab-20260913.yml'

permissions:
  contents: write

jobs:
  append-vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append true new words only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/daily-vocab-data.js')
          text = p.read_text(encoding='utf-8')
          prefix = 'window.DAILY_VOCAB_DB = '
          if not text.startswith(prefix):
              raise SystemExit('unexpected daily-vocab-data.js prefix')
          body = text[len(prefix):].strip()
          if body.endswith(';'):
              body = body[:-1]
          data = json.loads(body)
          existing = {str(x.get('word','')).strip().lower() for x in data}
          additions = [
            {
              'word':'hasil','cn':'结果；成果','en':'result; outcome','root':'hasil','root_cn':'结果；成果',
              'example':'Kita lihat hasilnya dulu sebelum menentukan langkah berikutnya.','example_cn':'我们先看看结果，再决定下一步。'
            },
            {
              'word':'alasan','cn':'理由；原因','en':'reason','root':'alas','root_cn':'垫；基础（词源相关）',
              'example':'Kalau kamu nggak setuju, jelasin alasannya dengan singkat.','example_cn':'如果你不同意，就简短说明理由。'
            },
            {
              'word':'bukti','cn':'证据；证明','en':'evidence; proof','root':'bukti','root_cn':'证据；证明',
              'example':'Jangan buru-buru menyimpulkan kalau belum ada bukti yang jelas.','example_cn':'如果还没有明确证据，就别急着下结论。'
            },
            {
              'word':'sebelumnya','cn':'之前；先前','en':'previously; before that','root':'sebelum','root_cn':'在……之前',
              'example':'Sebelumnya aku kira datanya sudah lengkap, ternyata masih kurang satu bagian.','example_cn':'之前我以为数据已经齐全了，结果还缺一部分。'
            }
          ]
          added = 0
          for x in additions:
              key = x['word'].strip().lower()
              if key in existing:
                  continue
              x.update({
                'categories':['每日学习','19:00'],
                'times_seen':1,
                'first_seen':'2026-09-13 19:00',
                'last_seen':'2026-09-13 19:00',
                'sessions':['19:00'],
                'dates':['2026-09-13']
              })
              data.append(x)
              existing.add(key)
              added += 1
          p.write_text(prefix + json.dumps(data, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')
          print(f'added={added}')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- data/daily-vocab-data.js; then
            echo 'No vocabulary changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily-vocab-data.js
          git commit -m 'content: append 2026-09-13 pm vocabulary'
          git push

# one-time trigger: 2026-09-13T19:08+07:00
