name: Fix 2026-09-15 daily vocab
on:
  push:
    paths:
      - '.github/workflows/fix-2026-09-15-daily-vocab.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct daily vocab
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('data/daily-vocab-data.js')
          text=p.read_text(encoding='utf-8')
          m=re.search(r'window\.DAILY_VOCAB_DB\s*=\s*(\[.*\])\s*;?\s*$', text, re.S)
          if not m:
              raise SystemExit('Cannot parse DAILY_VOCAB_DB')
          data=json.loads(m.group(1))
          wrong={'berhasil','peluang','kendala','keahlian','rekan kerja','pelanggan','pendapatan','pemasok','lemot','resign'}
          # Remove only records first introduced by the invalid 2026-09-15 AM lesson.
          kept=[]
          for x in data:
              w=str(x.get('word','')).strip().lower()
              first=str(x.get('first_seen',''))
              if w in wrong and first.startswith('2026-09-15'):
                  continue
              kept.append(x)
          data=kept
          corrected=[
            ('segera','尽快；马上；立即','immediately; promptly','segera',False),
            ('hasil','结果；成果','result; outcome','hasil',False),
            ('menarik','有趣的；吸引人的','interesting; attractive','tarik',False),
            ('umum','一般的；普遍的；公共的','general; common; public','umum',False),
            ('menerima','接受；收到；接收','receive; accept','terima',False),
            ('muncul','出现；冒出来','appear; emerge','muncul',False),
            ('nyata','真实的；实际存在的','real; actual','nyata',False),
            ('sebaiknya','最好；应该（委婉建议）','should; had better','baik',False),
            ('nyebelin','烦人；让人不爽（口语）','annoying','sebel',True),
            ('kepikiran','一直想到；挂在心上（口语）','keep thinking about','pikir',True),
          ]
          existing={str(x.get('word','')).strip().lower() for x in data}
          for w,cn,en,root,oral in corrected:
              if w in existing:
                  continue
              cats=['每日学习','08:00'] + (['口语'] if oral else [])
              data.append({
                'word':w,'cn':cn,'en':en,'root':root,'categories':cats,
                'times_seen':1,'first_seen':'2026-09-15 08:00','last_seen':'2026-09-15 08:00',
                'sessions':['08:00'],'dates':['2026-09-15']
              })
          p.write_text('window.DAILY_VOCAB_DB = '+json.dumps(data,ensure_ascii=False,indent=2)+';\n',encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-2026-09-15-daily-vocab.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily-vocab-data.js .github/workflows/fix-2026-09-15-daily-vocab.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct 2026-09-15 AM daily vocab entries'
          git push origin HEAD:main
