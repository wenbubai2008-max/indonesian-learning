name: Fix 2026-09-14 oral categories

on:
  push:
    paths:
      - '.github/workflows/fix-oral-category-2026-09-14.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark oral vocabulary
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('data/daily-vocab-data.js')
          text = path.read_text(encoding='utf-8').strip()
          prefix = 'window.DAILY_VOCAB_DB = '
          items = json.loads(text[len(prefix):-1].strip())
          targets = {'mantap', 'susah'}
          found = set()
          changed = False
          for item in items:
              key = str(item.get('word','')).strip().lower()
              if key in targets and '2026-09-14' in item.get('dates', []):
                  found.add(key)
                  cats = item.setdefault('categories', [])
                  if '口语' not in cats:
                      cats.append('口语')
                      changed = True
          if found != targets:
              raise SystemExit(f'Missing oral targets: {targets-found}')
          if changed:
              path.write_text(prefix + json.dumps(items, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-vocab-data.js
          git commit -m "Mark 2026-09-14 oral vocabulary"
          git push
