name: Install vocabulary library switcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-vocab-library-switcher.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert vocabulary library scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          daily='<script src="data/daily-vocab-data.js?v=1"></script>'
          switcher='<script src="data/library-switcher.js?v=1"></script>'
          if daily not in s:
              s=s.replace('</body></html>', daily+switcher+'</body></html>')
          elif switcher not in s:
              s=s.replace('</body></html>', switcher+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add selectable vocabulary libraries"
          git push
