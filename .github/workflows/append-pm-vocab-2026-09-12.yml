name: Append 2026-09-12 PM vocab

on:
  push:
    paths:
      - '.github/workflows/append-pm-vocab-2026-09-12.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Append only true new PM vocab
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/daily-vocab-data.js';
          const src = fs.readFileSync(path, 'utf8');
          const prefix = 'window.DAILY_VOCAB_DB = ';
          if (!src.startsWith(prefix)) throw new Error('Unexpected daily-vocab-data.js format');
          const jsonText = src.slice(prefix.length).trim().replace(/;\s*$/, '');
          const db = JSON.parse(jsonText);
          const additions = [
            {
              word: 'keputusan', cn: '决定；决策', en: 'decision', root: 'putus', root_cn: '断开；结束；作出决定',
              example: 'Sebelum ambil keputusan, kita dengar pendapat semua orang dulu.',
              example_cn: '做决定之前，我们先听听所有人的意见。',
              categories: ['每日学习','19:00'], times_seen: 1,
              first_seen: '2026-09-12 19:00', last_seen: '2026-09-12 19:00', sessions: ['19:00'], dates: ['2026-09-12']
            },
            {
              word: 'kesempatan', cn: '机会；时机', en: 'opportunity; chance', root: 'sempat', root_cn: '有空；来得及；有机会',
              example: 'Kasih dia kesempatan buat jelasin maksudnya dulu.',
              example_cn: '先给他一个机会解释一下自己的意思。',
              categories: ['每日学习','19:00'], times_seen: 1,
              first_seen: '2026-09-12 19:00', last_seen: '2026-09-12 19:00', sessions: ['19:00'], dates: ['2026-09-12']
            },
            {
              word: 'sikap', cn: '态度；立场；举止', en: 'attitude; stance', root: 'sikap', root_cn: '态度；立场',
              example: 'Walaupun beda pendapat, sikap kita tetap harus tenang.',
              example_cn: '即使意见不同，我们的态度还是要冷静。',
              categories: ['每日学习','19:00'], times_seen: 1,
              first_seen: '2026-09-12 19:00', last_seen: '2026-09-12 19:00', sessions: ['19:00'], dates: ['2026-09-12']
            }
          ];
          const seen = new Set(db.map(x => String(x.word || '').trim().toLowerCase()));
          for (const item of additions) {
            const key = item.word.trim().toLowerCase();
            if (!seen.has(key)) { db.push(item); seen.add(key); }
          }
          fs.writeFileSync(path, prefix + JSON.stringify(db, null, 2) + ';\n');
          NODE
      - name: Commit vocabulary database
        run: |
          if git diff --quiet -- data/daily-vocab-data.js; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily-vocab-data.js
          git commit -m 'Add 2026-09-12 PM new vocabulary'
          git push
